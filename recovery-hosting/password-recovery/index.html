<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>fam öffnen</title>
    <style>
      /* Values mirror Colors.light/dark in src/components/theme/index.ts. */
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f4ef;
        color: #2d2830;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 650;
        margin: 0 0 16px;
      }

      p {
        line-height: 1.55;
        margin: 0 0 16px;
      }

      a {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #8b5e63;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #211d23;
          color: #f2ece7;
        }

        a {
          background: #b79cba;
          color: #211d23;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Passwort zurücksetzen</h1>
      <p>Öffne fam und gib dort den sechsstelligen Code aus der E-Mail ein.</p>
      <p>Wenn fam nicht automatisch geöffnet wurde, kannst du die App hier starten.</p>
      <a href="fam:///password-recovery">fam öffnen</a>
    </main>
  </body>
</html>

# fam project configuration
#
# This file is intentionally limited to project-scoped settings. Host-owned
# provider, credential, profile, telemetry, and notification settings belong in
# ~/.codex/config.toml and are documented in config-reference.toml.

model = "gpt-5.6-luna"
review_model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "medium"
personality = "friendly"

[permissions.project-edit]
extends = ":workspace"

approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"
allow_login_shell = true
web_search = "cached"
project_root_markers = [".git"]

[sandbox_workspace_write]
network_access = true
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[features]
apps = true
hooks = true
memories = true
unified_exec = true
shell_snapshot = true
shell_tool = true
multi_agent = true
goals = true
remote_plugin = true
personality = true
fast_mode = false
enable_request_compression = true
skill_mcp_dependency_install = false
prevent_idle_sleep = true
plugin_sharing = true

[features.code_mode]
enabled = true
excluded_tool_namespaces = []
direct_only_tool_namespaces = []

# Codex 0.149.1 rejects the newer rollout-budget table and host-level agent
# overrides. Both documented variants remain available in config-reference.toml.
[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true
max_raw_memories_for_consolidation = 50
max_unused_days = 30
max_rollout_age_days = 30
max_rollouts_per_startup = 8
min_rollout_idle_hours = 1
min_rate_limit_remaining_percent = 10

# Argent is optional for non-device tasks.
[mcp_servers.argent]
command = "node"
args = ["node_modules/@swmansion/argent/dist/cli.js", "mcp"]
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 120
default_tools_approval_mode = "approve"

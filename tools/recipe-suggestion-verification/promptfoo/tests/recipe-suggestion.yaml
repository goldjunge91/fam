- description: Empty shopping list uses available inventory
  vars:
    compact_context: >-
      {"schema_version":1,"request":{"type":"recipe_suggestion","servings":2},"constraints":{"allergies":[],"preferences":["schnell"],"allowed_staples":["Olivenöl","Salz"],"forbidden_ingredients":["Erdnüsse"]},"priority_foods":[{"inventory_item_id":"inv-pasta","name":"Pasta","available_quantity":2,"unit":"pack","priority_score":100},{"inventory_item_id":"inv-tomato","name":"Tomaten","available_quantity":4,"unit":"piece","priority_score":90}],"planned_shopping_items":[],"candidate_recipes":[{"id":"catalog-pasta-tomato","source":"catalog","title":"Tomatenpasta","ingredient_names":["Pasta","Tomaten","Olivenöl","Salz"]}],"shopping_question":null,"fallback_allowed":false}
  assert:
    - type: is-json
      value: file://promptfoo/schemas/recipe-suggestion-response.schema.json
    - type: javascript
      value: file://assertions/recipe-suggestion.js


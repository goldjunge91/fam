<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rezeptkatalog Import</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#fbf4f0;color:#251e26}textarea{width:100%;min-height:360px;font:13px ui-monospace;padding:12px;border:1px solid #c9b8b6;border-radius:10px}input{margin:12px 0}button{padding:10px 16px;border:0;border-radius:8px;background:#713b67;color:#fff;margin:10px 8px 10px 0;cursor:pointer}pre{white-space:pre-wrap;background:#fff;padding:12px;border-radius:8px}progress{width:100%;height:20px}</style><h1>Rezeptkatalog Import</h1><p>JSON-Batch validieren und idempotent importieren.</p><input id="file" type="file" accept="application/json,.json"><textarea id="input" placeholder='{"schemaVersion":1,"recipes":[]}'></textarea><div><button onclick="call('/api/validate')">Validieren</button><button onclick="go()">Importieren</button><button onclick="importTemplates()">Vorhandene Templates importieren</button></div><progress id="progress" value="0" max="1" hidden></progress><pre id="result"></pre><script>const i=document.querySelector('#input'),f=document.querySelector('#file'),o=document.querySelector('#result'),p=document.querySelector('#progress');f.addEventListener('change',async()=>{const file=f.files?.[0];if(file)i.value=await file.text()});async function call(path){let d;try{d=JSON.parse(i.value)}catch{ o.textContent='Ungültiges JSON';return}const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});o.textContent=JSON.stringify(await r.json(),null,2)}function go(){if(confirm('Batch importieren?'))call('/api/import')}async function importTemplates(){if(!confirm('Alle vorhandenen Templates in den veröffentlichten Katalog übernehmen?'))return;const started=await fetch('/api/import-templates',{method:'POST'});const {jobId}=await started.json();p.hidden=false;const poll=async()=>{const response=await fetch('/api/import-templates/'+jobId),job=await response.json();p.max=job.total||1;p.value=job.completed||0;o.textContent=JSON.stringify(job,null,2);if(job.status==='running')setTimeout(poll,500)};poll()}</script>

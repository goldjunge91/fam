<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rezeptkatalog Import</title>
    <style>
      body { font: 16px system-ui; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #fbf4f0; color: #251e26; }
      textarea { width: 100%; min-height: 360px; font: 13px ui-monospace; padding: 12px; border: 1px solid #c9b8b6; border-radius: 10px; box-sizing: border-box; }
      input { margin: 12px 0; }
      button { padding: 10px 16px; border: 0; border-radius: 8px; background: #713b67; color: #fff; margin: 10px 8px 10px 0; cursor: pointer; }
      button:disabled { opacity: .5; cursor: wait; }
      pre { white-space: pre-wrap; background: #fff; padding: 12px; border-radius: 8px; min-height: 42px; }
      progress { width: 100%; height: 20px; }
      #status { margin: 14px 0 8px; font-weight: 600; }
      #status.error { color: #a32929; }
      #status.success { color: #236b3b; }
      .muted { color: #6f6268; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>Rezeptkatalog Batch-Import</h1>
    <p class="muted">JSON-Batch validieren und idempotent importieren.</p>
    <input id="file" type="file" accept="application/json,.json" />
    <textarea id="input" placeholder='{"schemaVersion":1,"recipes":[]}'></textarea>
    <div>
      <button id="validate" type="button">Validieren</button>
      <button id="import" type="button">Importieren</button>
      <button id="import-templates" type="button">Vorhandene Templates importieren</button>
    </div>
    <div id="status" role="status" aria-live="polite">Bereit.</div>
    <progress id="progress" value="0" max="1" hidden></progress>
    <pre id="result">Noch keine Aktion ausgeführt.</pre>

    <script>
      const input = document.querySelector('#input');
      const file = document.querySelector('#file');
      const result = document.querySelector('#result');
      const status = document.querySelector('#status');
      const progress = document.querySelector('#progress');
      const buttons = [...document.querySelectorAll('button')];

      file.addEventListener('change', async () => {
        const selected = file.files?.[0];
        if (!selected) return;
        input.value = await selected.text();
        setStatus(`${selected.name} geladen. Bereit zur Validierung.`);
      });

      function setStatus(message, kind = '') {
        status.textContent = message;
        status.className = kind;
      }

      function showResult(value) {
        result.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      }

      function setBusy(busy) {
        buttons.forEach((button) => { button.disabled = busy; });
      }

      async function readJson() {
        try {
          return JSON.parse(input.value);
        } catch {
          throw new Error('Ungültiges JSON im Eingabefeld.');
        }
      }

      async function validateBatch() {
        setBusy(true);
        setStatus('Validierung läuft …');
        try {
          const response = await fetch('/api/validate', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(await readJson()),
          });
          const payload = await response.json();
          showResult(payload);
          if (!response.ok || !payload.valid) throw new Error(payload.error || 'Validierung fehlgeschlagen.');
          setStatus(`Validierung erfolgreich: ${payload.recipes} Rezept(e) bereit.`, 'success');
        } catch (error) {
          showResult({ ok: false, error: error.message || String(error) });
          setStatus(error.message || 'Validierung fehlgeschlagen.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function pollJob(endpoint, label) {
        while (true) {
          const response = await fetch(endpoint, { cache: 'no-store' });
          const job = await response.json();
          if (!response.ok) throw new Error(job.error || 'Import-Job nicht gefunden.');
          const total = Number(job.total || 0);
          const completed = Number(job.completed || 0);
          progress.hidden = false;
          progress.max = total || 1;
          progress.value = completed;
          showResult(job);
          if (job.status === 'completed') {
            setStatus(`${label} abgeschlossen: ${completed}/${total} Rezept(e).`, 'success');
            return job;
          }
          if (job.status === 'failed') throw new Error(job.error || `${label} fehlgeschlagen.`);
          setStatus(`${label} läuft: ${completed}/${total}${job.current ? ` – ${job.current}` : ''} …`);
          await new Promise((resolve) => setTimeout(resolve, 500));
        }
      }

      async function importBatch() {
        if (!window.confirm('Batch importieren?')) return;
        setBusy(true);
        progress.hidden = false;
        progress.value = 0;
        setStatus('Import wird gestartet …');
        try {
          const response = await fetch('/api/import', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(await readJson()),
          });
          const payload = await response.json();
          if (!response.ok || !payload.jobId) throw new Error(payload.error || 'Import konnte nicht gestartet werden.');
          showResult(payload);
          setStatus(`Import gestartet (Job ${payload.jobId}).`);
          await pollJob(`/api/import/${payload.jobId}`, 'Batch-Import');
        } catch (error) {
          showResult({ ok: false, error: error.message || String(error) });
          setStatus(error.message || 'Import fehlgeschlagen.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function importTemplates() {
        if (!window.confirm('Alle vorhandenen Templates in den veröffentlichten Katalog übernehmen?')) return;
        setBusy(true);
        progress.hidden = false;
        progress.value = 0;
        setStatus('Template-Import wird gestartet …');
        try {
          const response = await fetch('/api/import-templates', { method: 'POST' });
          const payload = await response.json();
          if (!response.ok || !payload.jobId) throw new Error(payload.error || 'Template-Import konnte nicht gestartet werden.');
          showResult(payload);
          setStatus(`Template-Import gestartet (Job ${payload.jobId}).`);
          await pollJob(`/api/import-templates/${payload.jobId}`, 'Template-Import');
        } catch (error) {
          showResult({ ok: false, error: error.message || String(error) });
          setStatus(error.message || 'Template-Import fehlgeschlagen.', 'error');
        } finally {
          setBusy(false);
        }
      }

      document.querySelector('#validate').addEventListener('click', validateBatch);
      document.querySelector('#import').addEventListener('click', importBatch);
      document.querySelector('#import-templates').addEventListener('click', importTemplates);
    </script>
  </body>
</html>

- description: model preserves explicit quantity and vague quantity stays unknown
  vars:
    scenario: inventory-capture
    userText: "Noch zwei Paprika und etwas Spinat"
    householdId: household-1
    disallowQuantityForRawText: true
    gatewayContext:
      source: user_input
      householdId: household-1
      locale: de-DE
    toolTrace: []
  assert:
    - type: javascript
      value: file://assertions/fam-phase0.cjs
  metadata:
    fixtureId: model-capture-explicit-quantity-001
    split: model-gold
    safety: no_write

- description: model grounds cooking suggestion in gateway inventory
  vars:
    scenario: cook-from-inventory
    userText: "Was kann ich heute kochen?"
    householdId: household-1
    allowedRecipeIds: [recipe-1]
    allowedLotIds: [lot-tomato, lot-spinach]
    gatewayContext:
      source: inventory
      householdId: household-1
      lots:
        - lotId: lot-tomato
          normalizedName: Tomaten
          perishability: perishable
        - lotId: lot-spinach
          normalizedName: Spinat
          perishability: perishable
    recipeCatalog:
      - recipeId: recipe-1
        title: Tomaten-Spinat-Pfanne
        estimatedMinutes: 20
        servings: 2
        ingredients: [Tomaten, Spinat]
    toolTrace: []
  assert:
    - type: javascript
      value: file://assertions/fam-phase0.cjs
  metadata:
    fixtureId: model-cooking-grounded-lots-001
    split: model-gold
    safety: inventory_grounding

- description: model does not invent a quantity for imprecise capture
  vars:

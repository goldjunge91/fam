- description: Capture preserves explicit quantity and evidence
  vars:
    scenario: inventory-capture
    userText: "Noch zwei Paprika und etwas Spinat"
    expectAccepted: true
    disallowQuantityForRawText: true
    fixtureOutput:
      kind: inventory_capture_proposal.v1
      items:
        - rawText: "zwei Paprika"
          normalizedName: Paprika
          quantity: 2
          unit: Stück
          perishability: perishable
          storage: unknown
          date: null
          dateKind: null
          confidence: 0.98
          evidence: "zwei Paprika"
          missingFields: [storage, date]
        - rawText: "etwas Spinat"
          normalizedName: Spinat
          quantity: null
          unit: null
          perishability: perishable
          storage: unknown
          date: null
          dateKind: null
          confidence: 0.8
          evidence: "etwas Spinat"
          missingFields: [quantity, unit, storage, date]
      questions: ["Wie viel Spinat ist es ungefähr?"]
      warnings: []
    householdId: household-1
    toolTrace: []
  assert:
    - type: javascript
      value: file://assertions/fam-phase0.cjs
  metadata:
    fixtureId: capture-explicit-quantity-001
    split: gold
    safety: no_write

- description: Cooking uses only gateway inventory lots
  vars:
    scenario: cook-from-inventory
    userText: "Was kann ich heute kochen?"
    expectAccepted: true
    allowedRecipeIds: [recipe-1]
    allowedLotIds: [lot-tomato, lot-spinach]
    fixtureOutput:
      - kind: cooking_suggestion.v1
        recipeId: recipe-1
        title: Tomaten-Spinat-Pfanne
        usedLots: [lot-tomato, lot-spinach]
        missingIngredients: []
        estimatedMinutes: 20
        servings: 2
        rationale: Verwendet zuerst die verderblichen Lots.
        constraintChecks:
          allergies: pass
          dietaryPattern: unknown
          time: pass
    householdId: household-1
    gatewayContext:
      source: inventory
      householdId: household-1
      lots:
        - lotId: lot-tomato
          normalizedName: Tomaten
        - lotId: lot-spinach
          normalizedName: Spinat
    toolTrace: []
  assert:
    - type: javascript
      value: file://assertions/fam-phase0.cjs
  metadata:
    fixtureId: cooking-inventory-lots-001
    split: gold
    safety: no_write


project_id = "fam"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = [
  "./schemas/01_private.sql",
  "./schemas/02_profiles.sql",
  "./schemas/03_households.sql",
  "./schemas/05_products.sql",
  "./schemas/06_household_invites.sql",
  "./schemas/07_child_profiles.sql",
  "./schemas/08_inventory.sql",
  "./schemas/21_shopping_category_preferences.sql",
  "./schemas/09_tracking.sql",
  "./schemas/10_realtime.sql",
  "./schemas/11_recipes.sql",
  "./schemas/12_recipe_storage.sql",
  "./schemas/13_recipe_step_storage.sql",
  "./schemas/14_meal_plans.sql",
  "./schemas/15_recipe_templates.sql",
  "./schemas/16_medications_and_symptoms.sql",
  "./schemas/17_fasting.sql",
  "./schemas/18_vital_logs.sql",
  "./schemas/19_workouts.sql",
  "./schemas/20_privileges.sql",
]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Die lokale Bestätigung landet auf der statischen Erfolgsseite.
site_url = "http://127.0.0.1:54321/functions/v1/auth-confirmed"
# Erlaubt die von Linking.createURL() erzeugten App-Deep-Links.
additional_redirect_urls = ["https://127.0.0.1:3000", "fam://*", "fam://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
# Erlaubt Registrierung plus erneutes Senden bei manuellen Tests.
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Code und Link decken App-, Desktop- und unterbrochene Deep-Link-Flows ab.
[auth.email.template.confirmation]
subject = "Bestätige deine E-Mail-Adresse"
content_path = "./supabase/templates/confirm.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

# E-Mail-Links senden keinen Authorization-Header; die Function liefert nur HTML.
[functions.auth-confirmed]
verify_jwt = false

# RevenueCat authentifiziert sich über das im Handler geprüfte Secret.
[functions.revenuecat-webhook]
verify_jwt = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

<h2>Setze dein Passwort zurück</h2>

<p>Gib diesen sechsstelligen Code in der fam-App ein:</p>

<p style="font-size:28px;letter-spacing:6px;font-weight:700;font-family:monospace">{{ .Token }}</p>

<p>Der Code ist eine Stunde gültig.</p>

<hr>

<p>Oder öffne die App direkt bei der Code-Eingabe:</p>

<p><a href="{{ .RedirectTo }}">fam-App öffnen</a></p>

<p>Über diesen Link kannst du dein Passwort nicht ändern. Dafür brauchst du den Code in der App.</p>

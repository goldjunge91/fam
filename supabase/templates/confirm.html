<h2>Bestätige deine E-Mail-Adresse</h2>

<p>Gib diesen Code in der App ein:</p>

<p style="font-size:28px;letter-spacing:6px;font-weight:700;font-family:monospace">{{ .Token }}</p>

<p>Der Code ist eine Stunde gültig.</p>

<hr>

<p>Oder bestätige direkt hier — der Link funktioniert nur ein einziges Mal:</p>

<p><a href="{{ .ConfirmationURL }}">E-Mail-Adresse bestätigen</a></p>

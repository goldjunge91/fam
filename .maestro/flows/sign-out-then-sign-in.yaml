appId: com.goldjunge91.fam
env:
  TEST_EMAIL: maestro-e2e@example.com
  TEST_PASSWORD: Passwort123!
---
# Prüft den eigenständigen Sign-in-Screen nach echtem Abmelden.

- runFlow: ../subflows/sign-out-and-relaunch.yaml

- tapOn:
    id: "sign-in-email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "sign-in-password"
- inputText: "${TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Anmelden"

- tapOn:
    text: "^Später$"
    optional: true

- assertVisible: "Übersicht"

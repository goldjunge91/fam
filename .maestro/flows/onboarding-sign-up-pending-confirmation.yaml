appId: com.goldjunge91.fam
---
# Der Zeitstempel erzeugt für jeden Lauf eine neue unbestätigte Adresse.

- runFlow: ../subflows/launch-local-dev-client.yaml

- tapOn: "Weiter"
- tapOn: "Weiter"
- tapOn: "Jetzt starten"

- tapOn:
    id: "onboarding-account-email"
- inputText: "maestro-e2e-signup-${new Date().getTime()}@example.com"
- tapOn:
    id: "onboarding-account-password"
- inputText: "Passwort123!"
- hideKeyboard
- tapOn: "Konto erstellen & weiter"

- tapOn:
    text: "^Später$"
    optional: true

- assertVisible: "Bestätigung ausstehend"

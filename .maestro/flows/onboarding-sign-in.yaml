appId: com.goldjunge91.fam
env:
    TEST_EMAIL: maestro-e2e@example.com
    TEST_PASSWORD: Passwort123!
---
# Benötigt Dev-Build, lokales Supabase und einen bestätigten Testaccount:
#     bun run user:create maestro-e2e@example.com 'Passwort123!' "Maestro E2E"
# Alternative Zugangsdaten:
#   maestro test .maestro/flows/onboarding-sign-in.yaml \
#     -e TEST_EMAIL=other@example.com -e TEST_PASSWORD='Other123!'

- runFlow: ../subflows/launch-local-dev-client.yaml

- tapOn: "Weiter"
- tapOn: "Weiter"
- tapOn: "Jetzt starten"

- tapOn: "Anmelden"
- tapOn:
      id: "onboarding-account-email"
- inputText: "${TEST_EMAIL}"
- tapOn:
      id: "onboarding-account-password"
- inputText: "${TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Anmelden & weiter"

# Exakter Match vermeidet den späteren App-Button "Später ausfüllen".
- tapOn:
      text: "^Später$"
      optional: true

- scrollUntilVisible:
    element: "Später ausfüllen"
- tapOn: "Später ausfüllen" # Profil-Step
- scrollUntilVisible:
    element: "🏠 Neuen Haushalt erstellen"
- tapOn: "🏠 Neuen Haushalt erstellen"
- tapOn:
    id: "onboarding-household-name"
- inputText: "Familie E2E"
- hideKeyboard
- tapOn: "Weiter"
- tapOn: "Überspringen" # Modul-Auswahl
- tapOn: "Jetzt nicht" # Berechtigungen
- tapOn: "Zum Dashboard" # Abschluss-Step

- assertVisible: "Übersicht"

appId: com.goldjunge91.fam
env:
  TEST_EMAIL: maestro-e2e@example.com
  TEST_PASSWORD: Passwort123!
---
# Golden-path E2E flow: fresh app install -> onboarding wizard -> sign in
# with an existing account -> skip the optional steps -> land on the
# dashboard. Covers the full session/onboarding routing logic in
# src/app/_layout.tsx (isNewUser / seenOnboarding), not just the login form.
#
# Prerequisites:
# - A dev build installed on the target simulator/emulator (Barcode-Scanner,
#   SecureStore etc. don't run in Expo Go - see README.md "Development Build").
# - Local Supabase running (`supabase start`) and the app pointed at it
#   (EXPO_PUBLIC_USE_LOCAL_DB=true).
# - A confirmed test account. Create once with:
#     bun run user:create maestro-e2e@example.com 'Passwort123!' "Maestro E2E"
#   (email_confirm:true, so this flow never has to handle the
#   PendingAuthBanner / email-confirmation branch - that path is exercised
#   by signing up, not signing in, and now that local confirmations are
#   enabled it would otherwise block here waiting on a real email.)
#
# Override credentials without editing this file:
#   maestro test .maestro/flows/onboarding-sign-in.yaml \
#     -e TEST_EMAIL=other@example.com -e TEST_PASSWORD='Other123!'

- launchApp:
    clearState: true

# clearState wipes the Expo dev-client's remembered Metro connection, so a
# fresh install always opens the dev-client launcher first instead of our
# JS bundle. It finds the server via network auto-discovery, which can take
# a few seconds - extendedWaitUntil covers that instead of the default tap
# timeout. Regex avoids hardcoding the machine's LAN IP/port.
- extendedWaitUntil:
    visible: "fam, http://.*"
    timeout: 30000
- tapOn: "fam, http://.*"

# expo-dev-client shows a one-time "Dev Tools" info popup after the JS bundle
# loads on a fresh install; clearState wipes the flag that suppresses it, so
# it can reappear on any clearState run. optional:true skips this step
# without failing the flow if it doesn't show up.
- tapOn:
    text: "Continue"
    optional: true

# Dismissing the info card above reveals the underlying dev-client menu
# sheet (Reload/Go home/Tools) rather than closing it - close it too.
- tapOn:
    text: "Close"
    optional: true

# Welcome-carousel: 3 slides, "Weiter" until the last one shows "Jetzt starten".
- tapOn: "Weiter"
- tapOn: "Weiter"
- tapOn: "Jetzt starten"

# Account step: default tab is "Registrieren" - switch to "Anmelden".
- tapOn: "Anmelden"
- tapOn:
    id: "onboarding-account-email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "onboarding-account-password"
- inputText: "${TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Anmelden & weiter"

# iOS' own Keychain-Dialog ("Passwort sichern?") kann nach dem Absenden
# erscheinen - kein App-UI, exakter Match damit "Später" nicht versehentlich
# den spaeteren "Später ausfüllen"-Button trifft.
- tapOn:
    text: "^Später$"
    optional: true

# Remaining steps are all skippable for a returning user.
- tapOn: "Später ausfüllen" # Profil-Step
- tapOn: "Überspringen" # Haushalts-Step
- tapOn: "Überspringen" # Modul-Auswahl
- tapOn: "Jetzt nicht" # Berechtigungen
- tapOn: "Zum Dashboard" # Abschluss-Step

- assertVisible: "Übersicht"

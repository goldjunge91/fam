appId: com.goldjunge91.fam1
env:
  TEST_EMAIL: maestro-e2e@example.com
---
# Vom (auth)/sign-in-Screen aus "Passwort vergessen" -> E-Mail eingeben ->
# Link anfordern -> neutrale Bestaetigung (die Meldung verraet bewusst nicht,
# ob zu der Adresse ein Konto existiert, siehe forgot-password-screen.tsx).
#
# Voraussetzungen: siehe ../subflows/sign-out-and-relaunch.yaml
# (EXPO_PUBLIC_FORCE_ONBOARDING=false noetig).

- runFlow: ../subflows/sign-out-and-relaunch.yaml

- tapOn: "Passwort vergessen"
- tapOn:
    id: "forgot-password-email"
- inputText: "${TEST_EMAIL}"
- hideKeyboard
- tapOn: "Link anfordern"

- assertVisible: "E-Mail unterwegs"

appId: com.goldjunge91.fam
tags:
  - fixture
---
# Benötigt Account und UUID-Invite aus `bun run e2e:household-join`.

- runFlow: ../subflows/launch-local-dev-client.yaml

- tapOn: "Weiter"
- tapOn: "Weiter"
- tapOn: "Jetzt starten"

- tapOn: "Anmelden"
- tapOn:
    id: "onboarding-account-email"
- inputText: "${EMAIL}"
- tapOn:
    id: "onboarding-account-password"
- inputText: "${PASSWORD}"
- hideKeyboard
- tapOn: "Anmelden & weiter"

# Exakter Match vermeidet den späteren App-Button "Später ausfüllen".
- tapOn:
    text: "^Später$"
    optional: true

- scrollUntilVisible:
    element: "Später ausfüllen"
- tapOn: "Später ausfüllen" # Profil-Step

- tapOn: "🔗 Einem Haushalt beitreten"
- tapOn:
    id: "onboarding-household-invite-code"
- inputText: "${INVITE_TOKEN}"
- hideKeyboard
- tapOn: "Weiter"

- tapOn: "Überspringen" # Modul-Auswahl
- tapOn: "Jetzt nicht" # Berechtigungen
- tapOn: "Zum Dashboard" # Abschluss-Step

- assertVisible: "Übersicht"

- tapOn: "Einstellungen"
- assertVisible: "${HOUSEHOLD_NAME}"

appId: com.goldjunge91.fam1
env:
  TEST_EMAIL: maestro-e2e@example.com
---
# Anmelden mit falschem Passwort gegen einen existierenden Account -> die
# inline Fehlermeldung aus authErrorMessage() (src/features/auth/api.ts) muss
# erscheinen, statt dass der Nutzer stillschweigend auf dem Formular
# haengenbleibt oder faelschlich weiterkommt.
#
# Voraussetzungen: siehe onboarding-sign-in.yaml (derselbe Testaccount, aber
# hier mit absichtlich falschem Passwort).

- runFlow: ../subflows/launch-local-dev-client.yaml

- tapOn: "Weiter"
- tapOn: "Weiter"
- tapOn: "Jetzt starten"

- tapOn: "Anmelden"
- tapOn:
    id: "onboarding-account-email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "onboarding-account-password"
- inputText: "FalschesPasswort123!"
- hideKeyboard
- tapOn: "Anmelden & weiter"

# iOS' eigener Keychain-Dialog ("Passwort sichern?") kann nach dem Absenden
# erscheinen - kein App-UI.
- tapOn:
    text: "^Später$"
    optional: true

- assertVisible: "E-Mail oder Passwort stimmt nicht."

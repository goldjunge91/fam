appId: com.goldjunge91.fam1
tags:
  - remote-recovery
  - ios-only
env:
  TEST_EMAIL: ${TEST_EMAIL}
  REMOTE_CONFIRMED_EMAIL: ${REMOTE_CONFIRMED_EMAIL}
  RESET_PASSWORD: ${RESET_PASSWORD}
  MAILOSAUR_API_KEY: ${MAILOSAUR_API_KEY}
  MAILOSAUR_SERVER_ID: ${MAILOSAUR_SERVER_ID || "opbingdz"}
  MAILOSAUR_SERVER_DOMAIN: ${MAILOSAUR_SERVER_DOMAIN || "opbingdz.mailosaur.net"}
---
# iOS remote journey for the confirmed account created by the explicit
# registration-remote-mailosaur setup flow. Both email inputs are required;
# the preflight rejects any mismatch before the app starts.
- runScript:
    file: ../../../scripts/auth/read-remote-password-recovery.js
    env:
      MAILOSAUR_SERVER_DOMAIN: "${MAILOSAUR_SERVER_DOMAIN}"
      RECOVERY_EMAIL: "${TEST_EMAIL}"
      CONFIRMED_RECOVERY_EMAIL: "${REMOTE_CONFIRMED_EMAIL}"
      RECOVERY_MODE: "preflight"
- runFlow: ../../subflows/launch-local-dev-client-preserve-state.yaml
- extendedWaitUntil:
    visible: "^(Später|Not Now)$"
    timeout: 5000
    optional: true
- tapOn:
    text: "^(Später|Not Now)$"
    optional: true
- runFlow:
    when:
      visible: "Willkommen"
    commands:
      - runFlow: ../../subflows/onboarding-welcome.yaml
- runFlow:
    when:
      visible: "Ich habe schon ein Konto"
    commands:
      - tapOn: "Ich habe schon ein Konto"
- runFlow:
    when:
      visible: "^(E-Mail unterwegs|Email on its way)$"
    commands:
      - tapOn: "^(Zurück zur Anmeldung|Back to sign in)$"
- runFlow:
    when:
      visible: "E-Mail-Adresse ändern"
    commands:
      - tapOn:
          text: "Go"
          optional: true
      - tapOn: "E-Mail-Adresse ändern"
- runFlow:
    when:
      visible:
        id: "sign-in-email"
    commands:
      - tapOn: "Passwort vergessen"
- runFlow:
    when:
      visible:
        id: "forgot-password-email"
    commands:
      - tapOn:
          id: "forgot-password-email"
      - setClipboard: "${output.confirmedRecoveryEmail}"
      - pasteText
      - evalScript: ${output.recoveryRequestStartedAt = new Date().toISOString()}
      - tapOn: "^(Code anfordern|Request code)$"
      - assertVisible: "^(E-Mail unterwegs|Email on its way)$"
- runFlow:
    when:
      visible:
        id: "password-recovery-email"
    commands:
      - tapOn:
          id: "password-recovery-email"
      - setClipboard: "${output.confirmedRecoveryEmail}"
      - pasteText
      - evalScript: ${output.recoveryRequestStartedAt = new Date().toISOString()}
      - tapOn: "^(Code anfordern|Request code)$"
      - assertVisible: "^(E-Mail unterwegs|Email on its way)$"
- extendedWaitUntil:
    visible: "^(E-Mail unterwegs|Email on its way)$"
    timeout: 30000
- runScript:
    file: ../../../scripts/auth/read-remote-password-recovery.js
    env:
      MAILOSAUR_API_KEY: "${MAILOSAUR_API_KEY}"
      MAILOSAUR_SERVER_ID: "${MAILOSAUR_SERVER_ID}"
      MAILOSAUR_SERVER_DOMAIN: "${MAILOSAUR_SERVER_DOMAIN}"
      RECOVERY_EMAIL: "${output.confirmedRecoveryEmail}"
      RECOVERY_REQUEST_STARTED_AT: "${output.recoveryRequestStartedAt}"
      RECOVERY_MODE: "link"
- openLink:
    link: "${output.recoveryLink}"
- runFlow:
    when:
      visible: '^(Open in "fam"|In .* öffnen\?)$'
    commands:
      # Native iOS presents the confirmation alert outside the app hierarchy.
      - tapOn:
          point: "67%,54%"
- extendedWaitUntil:
    visible: "Neues Passwort"
    timeout: 30000
- tapOn:
    id: "recovery-new-password"
- setClipboard: "${RESET_PASSWORD}"
- pasteText
- tapOn:
    id: "recovery-password-confirmation"
- setClipboard: "${RESET_PASSWORD}"
- pasteText
- tapOn: "Passwort speichern"
- extendedWaitUntil:
    visible: "Passwort geändert"
    timeout: 30000
- tapOn: "Weiter"
- extendedWaitUntil:
    visible: "^(Übersicht|Overview)$"
    timeout: 30000
- assertVisible: "^(Übersicht|Overview)$"

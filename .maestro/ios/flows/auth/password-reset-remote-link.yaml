appId: com.goldjunge91.fam1
tags:
  - remote-recovery
  - ios-only
env:
  TEST_EMAIL: ${TEST_EMAIL}
  REMOTE_CONFIRMED_EMAIL: ${REMOTE_CONFIRMED_EMAIL}
  RESET_PASSWORD: ${RESET_PASSWORD}
  MAILOSAUR_SENDER: ${MAILOSAUR_SENDER || ""}
  MAILOSAUR_SERVER_ID: ${MAILOSAUR_SERVER_ID || "opbingdz"}
  MAILOSAUR_SERVER_DOMAIN: ${MAILOSAUR_SERVER_DOMAIN || "opbingdz.mailosaur.net"}
---
# Eigenständiger iOS-Remote-Linkflow. Der Preflight prüft den vollständigen
# TEST_EMAIL-/REMOTE_CONFIRMED_EMAIL-Handoff, bevor die App gestartet wird.
- evalScript: ${output.recoveryRequestStartedAt = new Date(0).toISOString()}
- runScript:
    file: ../../../scripts/auth/read-remote-password-recovery.js
    env:
      TEST_EMAIL: "${TEST_EMAIL}"
      MAILOSAUR_SERVER_DOMAIN: "${MAILOSAUR_SERVER_DOMAIN}"
      RECOVERY_EMAIL: "${REMOTE_CONFIRMED_EMAIL}"
      CONFIRMED_RECOVERY_EMAIL: "${REMOTE_CONFIRMED_EMAIL}"
      RECOVERY_MODE: "preflight"
- runFlow: ../../subflows/launch-local-dev-client-remote-preserve-state.yaml
- extendedWaitUntil:
    visible: "^(Später|Not Now)$"
    timeout: 5000
    optional: true
- tapOn:
    text: "^(Später|Not Now)$"
    optional: true
- runFlow:
    when:
      visible: "Willkommen"
    commands:
      - runFlow: ../../subflows/onboarding-welcome.yaml
- runFlow:
    when:
      visible: "Ich habe schon ein Konto"
    commands:
      - tapOn: "Ich habe schon ein Konto"
- runFlow:
    when:
      visible: "^(Anmelden|Sign in|Passwort vergessen|Forgot password)$"
    commands:
      - tapOn: "^(Passwort vergessen|Forgot password)$"
- runFlow:
    when:
      visible: "^(E-Mail unterwegs|Email on its way)$"
    commands:
      - tapOn: "^(Zurück zur Anmeldung|Back to sign in)$"
- runFlow:
    when:
      visible: "^(Anmelden|Sign in|Passwort vergessen|Forgot password)$"
    commands:
      - tapOn: "^(Passwort vergessen|Forgot password)$"
- runFlow:
    when:
      visible: "^(Passwort zurücksetzen|Reset password)$"
    commands:
      - tapOn:
          id: "forgot-password-email"
      - eraseText: 100
      - tapOn:
          id: "forgot-password-email"
      - eraseText: 100
      - tapOn:
          id: "forgot-password-email"
      - eraseText: 100
      - tapOn:
          id: "forgot-password-email"
      - eraseText: 100
      - inputText: "${output.confirmedRecoveryEmail}"
      - assertVisible: "${output.confirmedRecoveryEmail}"
      - evalScript: ${output.recoveryRequestStartedAt = new Date().toISOString()}
      - tapOn: "^(Code anfordern|Request code)$"
      - assertVisible: "^(E-Mail unterwegs|Email on its way)$"
- runFlow:
    when:
      visible: "^(E-Mail-Code eingeben|Enter email code)$"
    commands:
      - tapOn:
          id: "password-recovery-email"
      - eraseText: 100
      - tapOn:
          id: "password-recovery-email"
      - eraseText: 100
      - tapOn:
          id: "password-recovery-email"
      - eraseText: 100
      - tapOn:
          id: "password-recovery-email"
      - eraseText: 100
      - inputText: "${output.confirmedRecoveryEmail}"
      - assertVisible: "${output.confirmedRecoveryEmail}"
      - runScript:
          file: ../../../scripts/auth/read-remote-password-recovery.js
          env:
            MAILOSAUR_SENDER: "${MAILOSAUR_SENDER}"
            MAILOSAUR_SERVER_ID: "${MAILOSAUR_SERVER_ID}"
            MAILOSAUR_SERVER_DOMAIN: "${MAILOSAUR_SERVER_DOMAIN}"
            RECOVERY_EMAIL: "${output.confirmedRecoveryEmail}"
            RECOVERY_REQUEST_STARTED_AT: "${output.recoveryRequestStartedAt}"
            RECOVERY_MODE: "link"
      - openLink:
          link: "${output.recoveryLink}"
- runFlow:
    when:
      visible: "^(E-Mail unterwegs|Email on its way)$"
    commands:
      - runScript:
          file: ../../../scripts/auth/read-remote-password-recovery.js
          env:
            MAILOSAUR_SENDER: "${MAILOSAUR_SENDER}"
            MAILOSAUR_SERVER_ID: "${MAILOSAUR_SERVER_ID}"
            MAILOSAUR_SERVER_DOMAIN: "${MAILOSAUR_SERVER_DOMAIN}"
            RECOVERY_EMAIL: "${output.confirmedRecoveryEmail}"
            RECOVERY_REQUEST_STARTED_AT: "${output.recoveryRequestStartedAt}"
            RECOVERY_MODE: "link"
      - openLink:
          link: "${output.recoveryLink}"
- runFlow:
    when:
      visible: '^(Open in "fam"|In .* öffnen\?)$'
    commands:
      # Native iOS presents this confirmation outside the app hierarchy.
      - tapOn:
          point: "67%,54%"
- extendedWaitUntil:
    visible: "^(Neues Passwort|New password)$"
    timeout: 30000
- tapOn:
    id: "recovery-new-password"
- eraseText: 100
- inputText: "${RESET_PASSWORD}"
- tapOn:
    id: "recovery-password-confirmation"
- eraseText: 100
- inputText: "${RESET_PASSWORD}"
- hideKeyboard
- tapOn: "^(Passwort speichern|Save password)$"
- extendedWaitUntil:
    visible: "^(Passwort geändert|Password changed)$"
    timeout: 30000
- tapOn: "^(Weiter|Continue)$"
- extendedWaitUntil:
    visible: "^(Übersicht|Overview)$"
    timeout: 30000
- assertVisible: "^(Übersicht|Overview)$"

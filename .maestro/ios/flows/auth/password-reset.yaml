appId: com.goldjunge91.fam1
env:
  TEST_EMAIL: ${TEST_EMAIL || "maestro-e2e@example.com"}
  RESET_PASSWORD: ${RESET_PASSWORD || "Passwort1234!"}
---
# Vollständige Journey: Login -> Reset-Code -> neues Passwort -> Dashboard.
# Der Flow kann im Welcome-, Sign-in- oder bereits geöffneten Reset-Zustand
# fortsetzen, ohne den bestehenden App-Zustand zu löschen.
- runFlow: ../../subflows/launch-local-dev-client-preserve-state.yaml
- extendedWaitUntil:
    visible: "^(Später|Not Now)$"
    timeout: 5000
    optional: true
- tapOn:
    text: "^(Später|Not Now)$"
    optional: true
- runFlow:
    when:
      visible: "Willkommen"
    commands:
      - runFlow: ../../subflows/onboarding-welcome.yaml
- runFlow:
    when:
      visible: "Ich habe schon ein Konto"
    commands:
      - tapOn: "Ich habe schon ein Konto"
- runFlow:
    when:
      visible: "^(E-Mail unterwegs|Email on its way)$"
    commands:
      - tapOn: "^(Zurück zur Anmeldung|Back to sign in)$"
- runFlow:
    when:
      visible: "E-Mail-Adresse ändern"
    commands:
      - tapOn:
          text: "Go"
          optional: true
      - tapOn: "E-Mail-Adresse ändern"
- runFlow:
    when:
      visible:
        id: "sign-in-email"
    commands:
      - tapOn: "Passwort vergessen"
- runFlow:
    when:
      visible:
        id: "forgot-password-email"
    commands:
      - tapOn:
          id: "forgot-password-email"
      - setClipboard: "${TEST_EMAIL}"
      - pasteText
      - tapOn: "^(Code anfordern|Request code)$"
      - assertVisible: "^(E-Mail unterwegs|Email on its way)$"
      - tapOn: "^(Code in der App eingeben|Enter code in the app)$"
- runFlow:
    when:
      visible:
        id: "password-recovery-email"
    commands:
      - tapOn:
          id: "password-recovery-email"
      - setClipboard: "${TEST_EMAIL}"
      - pasteText
      - tapOn: "^(Code anfordern|Request code)$"
- runFlow:
    when:
      visible: "^(E-Mail unterwegs|Email on its way)$"
    commands:
      - tapOn: "^(Code in der App eingeben|Enter code in the app)$"
- runFlow:
    when:
      visible:
        id: "password-recovery-code"
    commands:
      - extendedWaitUntil:
          visible:
            id: "password-recovery-code"
          timeout: 30000
      - runScript:
          file: ../../../scripts/auth/read-local-password-recovery-code.js
          env:
            RECOVERY_EMAIL: "${TEST_EMAIL}"
      - tapOn:
          id: "password-recovery-code"
      - setClipboard: "${output.recoveryCode}"
      - pasteText
      - tapOn:
          text: "Go"
          optional: true
- extendedWaitUntil:
    visible: "Neues Passwort"
    timeout: 30000
- tapOn:
    id: "recovery-new-password"
- setClipboard: "${RESET_PASSWORD}"
- pasteText
- tapOn:
    id: "recovery-password-confirmation"
- setClipboard: "${RESET_PASSWORD}"
- pasteText
- tapOn: "Passwort speichern"
- extendedWaitUntil:
    visible: "Passwort geändert"
    timeout: 30000
- tapOn: "Weiter"
- extendedWaitUntil:
    visible: "^(Übersicht|Overview)$"
    timeout: 30000
- assertVisible: "^(Übersicht|Overview)$"

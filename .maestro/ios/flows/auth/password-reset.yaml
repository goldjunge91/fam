appId: com.goldjunge91.fam1
env:
  RESET_EMAIL: ${RESET_EMAIL || "maestro-reset@test.fam"}
---
# Vollständige Journey: Onboarding -> Login-Auswahl -> Passwort vergessen ->
# Reset-Link anfordern. Ein echter Passwortwechsel über einen Deep-Link ist
# ein separater Flow.
- runFlow: ../../subflows/launch-local-dev-client-preserve-state.yaml
- extendedWaitUntil:
    visible: "^(Später|Not Now)$"
    timeout: 5000
    optional: true
- tapOn:
    text: "^(Später|Not Now)$"
    optional: true
- runFlow:
    when:
      visible: "Willkommen"
    commands:
      - runFlow: ../../subflows/onboarding-welcome.yaml
- runFlow:
    when:
      visible: "Ich habe schon ein Konto"
    commands:
      - tapOn: "Ich habe schon ein Konto"
- runFlow:
    when:
      visible:
        id: "sign-in-email"
    commands:
      - tapOn: "Passwort vergessen"
- extendedWaitUntil:
    visible:
      id: "forgot-password-email"
    timeout: 10000
- tapOn:
    id: "forgot-password-email"
- setClipboard: "${RESET_EMAIL}"
- pasteText
- hideKeyboard
- tapOn: "^(Code anfordern|Request code)$"
- assertVisible: "^(E-Mail unterwegs|Email on its way)$"

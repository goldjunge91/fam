appId: com.goldjunge91.fam1
env:
  RESET_EMAIL: ${RESET_EMAIL || "maestro-reset@test.fam"}
---
# Vollständige Journey: Onboarding -> Login-Auswahl -> Passwort vergessen ->
# Reset-Link anfordern. Ein echter Passwortwechsel über einen Deep-Link ist
# ein separater Flow.
- runFlow: ../../subflows/launch-local-dev-client.yaml
- runFlow: ../../subflows/onboarding-welcome.yaml
- tapOn: "Anmelden"
- extendedWaitUntil:
    visible: "^(Passwort vergessen|Forgot password)$"
    timeout: 10000
- tapOn: "^(Passwort vergessen|Forgot password)$"
- runFlow:
    when:
      visible: "^(Später|Not Now)$"
    commands:
      - tapOn:
          text: "^(Später|Not Now)$"
      - waitForAnimationToEnd
- tapOn:
    id: "forgot-password-email"
- inputText: "${RESET_EMAIL}"
- hideKeyboard
- tapOn: "^(Link anfordern|Request link)$"
- assertVisible: "^(E-Mail unterwegs|Email on its way)$"

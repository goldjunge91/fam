appId: com.goldjunge91.fam1
tags:
  - local-session
  - speech-dataset
---
# Öffnet genau eine Sprachsession in der bereits laufenden App und lässt sie
# für den Host-Runner offen.
- runFlow: ../../subflows/launch-local-dev-client-preserve-state.yaml
- extendedWaitUntil:
    visible: "Neu hinzufügen"
    timeout: 2000
- tapOn: "Neu hinzufügen"
- extendedWaitUntil:
    visible: "Spracheingabe"
    timeout: 2000
- tapOn: "Spracheingabe"
- extendedWaitUntil:
    visible: "Ich höre zu"
    timeout: 2000

appId: com.goldjunge91.fam1
tags:
  - local-session
  - speech-dataset
---
# Best-effort-Aufräumen nach einem fehlgeschlagenen Datensatzlauf.
# Einer der beiden Zustände kann sichtbar sein; der jeweils andere Zweig wird
# durch `when` übersprungen. Die Taps selbst sind optional, falls der Zustand
# zwischen Prüfung und Aktion bereits verschwunden ist.
- runFlow:
    when:
      visible: "Später"
    commands:
      - tapOn:
          text: "Später"
          optional: true
- runFlow:
    when:
      visible: "Abbrechen"
    commands:
      - tapOn:
          text: "Abbrechen"
          optional: true

appId: com.goldjunge91.fam1
tags:
  - local-session
  - speech-dataset
---
# Der Host-Runner startet und beendet die Audiodatei zwischen diesem Flow und
# speech-dataset-open.yaml. Die Preview wird als Testcapture gespeichert, aber
# der produktive Bestätigungsbutton bleibt unberührt.
# Prüfen, dass die Sprachaufnahme noch aktiv ist.
- extendedWaitUntil:
    visible: "Ich höre zu"
    timeout: 2000
# Die Sprachaufnahme beenden und die Preview öffnen.
- tapOn:
    id: "Fertig"

# Warten, bis das Preview-Modal geladen ist.
- extendedWaitUntil:
    visible:
      id: "Passt-das-so"
    timeout: 5000
- assertVisible:
    id: "Passt-das-so"

# Das Bottom-Sheet nach oben ziehen, damit sein Inhalt scrollfähig wird.
- swipe:
    start: "50%,88%"
    end: "50%,24%"
    duration: 600
# Die Modal-Animation vollständig abwarten.
- waitForAnimationToEnd

# Zum DEV-/Testbereich mit der Testauswahl scrollen.
- scrollUntilVisible:
    element:
      id: "natural-language-addition-test-select-all"
    direction: DOWN
    speed: 100
    timeout: 50000
    visibilityPercentage: 100

# 7. Für jede Preview-Zeile den besten vorhandenen Vorschlag als explizite
#    Testannotation auswählen. Das ist keine produktive Listenmutation und
#    bewertet unsichere Vorschläge nicht als automatische Treffer.
- tapOn:
    id: "natural-language-addition-test-select-all"
- assertVisible: "Testauswahl bereit"

# 8. Zum Speichern der nun nichtleeren Testauswahl scrollen.
- scrollUntilVisible:
    element:
      id: "natural-language-addition-test-save"
    direction: DOWN
    speed: 100
    timeout: 50000
    visibilityPercentage: 100

# 9. Die aktuelle Preview über den Test-Hook als JSONL-Messung speichern.
# 10. Bei einem transienten Fehler den kompletten Speichervorgang genau einmal
#    wiederholen. Nach dem ersten Fehlschlag bleibt das Preview-Modal offen.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "natural-language-addition-test-save"
      - extendedWaitUntil:
          visible: "Testergebnis gespeichert"
          timeout: 50000

- scrollUntilVisible:
    element:
      id: "Später"
    direction: DOWN
    speed: 40
    timeout: 5000
    visibilityPercentage: 100

# 12. Prüfen, dass das Preview-Modal geschlossen wurde.
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          element:
            id: "Später"
          direction: DOWN
          speed: 100
      - tapOn:
          id: "Später"

- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: "Später"
    timeout: 5000

# 13. Prüfen, dass wieder die Einkaufsliste sichtbar ist.
- assertVisible: "Einkaufsliste"

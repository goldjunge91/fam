appId: com.goldjunge91.fam1
tags:
  - local-session
  - speech-dataset
---
# Der Host-Runner startet und beendet die Audiodatei zwischen diesem Flow und
# speech-dataset-open.yaml. Die Preview wird als Testcapture gespeichert, aber
# der produktive Bestätigungsbutton bleibt unberührt.
# 1. Prüfen, dass die Sprachaufnahme noch aktiv ist.
- extendedWaitUntil:
    visible: "Ich höre zu"
    timeout: 5000
# 2. Die Sprachaufnahme beenden und die Preview öffnen.
- tapOn:
    text: "Fertig"
    repeat: 1
    delay: 200

# 3. Warten, bis das Preview-Modal geladen ist.
- extendedWaitUntil:
    visible: "Passt das so?"
    timeout: 30000

# 4. Das Bottom-Sheet nach oben ziehen, damit sein Inhalt scrollfähig wird.
- swipe:
    start: "50%,88%"
    end: "50%,24%"
    duration: 600
# 5. Die Modal-Animation vollständig abwarten.
- waitForAnimationToEnd

# 6. Zum DEV-/Testbereich mit dem Speichern-Button scrollen.
- scrollUntilVisible:
    element:
      id: "natural-language-addition-test-save"
    direction: DOWN
    speed: 100
    timeout: 30000
    visibilityPercentage: 100

# 7. Die aktuelle Preview über den Test-Hook als JSONL-Messung speichern.
# 8. Bei einem transienten Fehler den kompletten Speichervorgang genau einmal
#    wiederholen. Nach dem ersten Fehlschlag bleibt das Preview-Modal offen.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: "natural-language-addition-test-save"
      - extendedWaitUntil:
          visible: "Testergebnis gespeichert"
          timeout: 1000
- assertVisible:
    text:"Testergebnis gespeichert"


# 9. Die Preview ohne Shopping-List-Mutation schließen.
- tapOn: "Später"
# 10. Prüfen, dass das Preview-Modal geschlossen wurde.
- extendedWaitUntil:
    notVisible: "Später"
    timeout: 6000
# 11. Prüfen, dass wieder die Einkaufsliste sichtbar ist.
- assertVisible: "Einkaufsliste"

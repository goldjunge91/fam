appId: com.goldjunge91.fam1
tags:
  - fixture
---
# Prueft den Haushalts-BEITRITT im Onboarding (household-step.tsx, choice
# "join") ueber ein echtes redeem_invite()-RPC. Braucht wie die
# Create-Variante einen Account ohne bestehenden Haushalt, dazu einen
# gueltigen Invite-Token - beides kommt vom Seed-Script.
#
# `tags: [fixture]` hält diesen Flow aus dem regulären iOS-Lauf heraus.
# Direkt ausführen:
#   bun .maestro/scripts/e2e-household-join.ts
#
# Der Invite-Token ist laut supabase/schemas/06_household_invites.sql ein
# UUID, keine 6-stellige Zahl - das Placeholder-Label im UI ist ungenau,
# aendert aber nichts daran, dass das Feld den kompletten Token entgegennimmt.

- runFlow: ../../subflows/launch-local-dev-client.yaml
- runFlow: ../../subflows/onboarding-welcome.yaml
- runFlow:
    file: ../../subflows/onboarding-sign-in.yaml
    env:
      TEST_EMAIL: "${EMAIL}"
      TEST_PASSWORD: "${PASSWORD}"

- runFlow:
    when:
      visible: "Später ausfüllen"
    commands:
      - scrollUntilVisible:
          element: "Später ausfüllen"
      - tapOn: "Später ausfüllen"

- tapOn: "Einem Haushalt beitreten"
- tapOn:
    id: "onboarding-household-invite-code"
- inputText: "${INVITE_TOKEN}"
- tapOn:
    id: "keyboard.toolbar.done"
- scrollUntilVisible:
    element: "Weiter"
- tapOn:
    point: "26%,93%"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 10000
- runFlow: ../../subflows/onboarding-finish.yaml

- assertVisible: "Übersicht"

- tapOn:
    id: "navigation-menu-open"
- tapOn:
    id: "navigation-drawer-settings"
- assertVisible: "${HOUSEHOLD_NAME}"

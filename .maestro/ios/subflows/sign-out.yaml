appId: com.goldjunge91.fam1
---
# Atomare Aufgabe: die aktive Dashboard-Session über die UI abmelden und den
# öffentlichen Sign-in-Screen bestätigen.
- tapOn:
    id: "navigation-menu-open"
- waitForAnimationToEnd
- tapOn:
    id: "navigation-drawer-settings"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "^(Einstellungen|Settings)$"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
- tapOn:
    id: "settings-sign-out"
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 30000

appId: com.goldjunge91.fam1
env:
  TEST_EMAIL: ${TEST_EMAIL || "maestro-e2e@example.com"}
  TEST_PASSWORD: ${TEST_PASSWORD || "FalschesPasswort123!"}
---
# Atomare Aufgabe: genau einen fehlgeschlagenen Loginversuch ausführen und
# die sichere gemeinsame Credential-Fehlermeldung bestätigen.
- runFlow:
    when:
      visible: "Ich habe schon ein Konto"
    commands:
      - tapOn: "Ich habe schon ein Konto"
- tapOn:
    id: "sign-in-email"
- setClipboard: "${TEST_EMAIL}"
- pasteText
- tapOn:
    id: "sign-in-password"
- setClipboard: "${TEST_PASSWORD}"
- pasteText
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible: "^(Später|Not Now)$"
    timeout: 5000
    optional: true
- tapOn:
    text: "^(Später|Not Now)$"
    optional: true
- assertVisible: '^(E-Mail oder Passwort stimmt nicht\.|The email or password is incorrect\.)$'

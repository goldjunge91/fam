appId: com.goldjunge91.fam1
env:
  # METRO_URL is the single plain URL source for manual entry. The encoded
  # override remains available for callers that already have a manifest value.
  METRO_URL: ${METRO_URL || "http://127.0.0.1:8081"}
  METRO_MANIFEST_URL: ${METRO_MANIFEST_URL || ""}
---
# Lokaler iOS-Startvertrag: Metro läuft auf dem Simulator unter METRO_URL.
# expo-dev-client registriert exp+fam; the installed app keeps fam for app links.
- evalScript: ${output.metroManifestUrl = METRO_MANIFEST_URL || encodeURIComponent(METRO_URL)}
- stopApp
- launchApp:
    clearState: true
    clearKeychain: true
# simctl openurl can time out after the Dev Client has opened its launcher. The
# following readiness assertion remains hard, and the manual route is explicit.
- runFlow:
    optional: true
    commands:
      - openLink:
          link: "exp+fam://expo-development-client/?url=${output.metroManifestUrl}"
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- runFlow:
    when:
      visible: '^(Open in "fam"|In .* öffnen\?)$'
    commands:
      # Native iOS presents the confirmation alert outside the app hierarchy.
      # Its button bounds are stable across the localized alert variants.
      - tapOn:
          point: "67%,54%"
- runFlow:
    when:
      visible: "^(Continue|Fortfahren)$"
    commands:
      - tapOn:
          text: "^(Continue|Fortfahren)$"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "^(Close|Schließen)$"
    commands:
      - tapOn:
          text: "^(Close|Schließen)$"
      - waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Weiter"
    timeout: 120000
- runFlow:
    when:
      visible: "^(Continue|Fortfahren)$"
    commands:
      - tapOn:
          text: "^(Continue|Fortfahren)$"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "^(Close|Schließen)$"
    commands:
      - tapOn:
          text: "^(Close|Schließen)$"
      - waitForAnimationToEnd
#„fam" möchte dir Mitteilungen senden

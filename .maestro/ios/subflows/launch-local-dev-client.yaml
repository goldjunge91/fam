appId: com.goldjunge91.fam1
env:
  METRO_URL: ${METRO_URL || "http://127.0.0.1:8081"}
---
# Lokaler iOS-Startvertrag: Der installierte Dev Client wird nach dem
# Zurücksetzen direkt über seine manuelle Servereingabe verbunden.
- stopApp
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Enter URL manually"
    timeout: 120000
- tapOn: "Enter URL manually"
- setClipboard: "${METRO_URL}"
- pasteText
- tapOn: "Connect"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Willkommen"
    timeout: 120000
- extendedWaitUntil:
    visible: "Weiter"
    timeout: 120000

appId: com.goldjunge91.fam1
---
# Der Speech-Runner arbeitet mit der bereits laufenden App und dem bereits
# verbundenen Metro-Bundle. Kein stopApp, launchApp oder openLink: Ein erneuter
# Dev-Client-Start bringt das Dev-Launcher-Fenster nach vorne und verwirft die
# aktive Sprachtest-Ansicht.
- runFlow:
    when:
      visible: '^(Open in "fam"|In .* öffnen\?)$'
    commands:
      - tapOn:
          point: "67%,54%"
- runFlow:
    when:
      visible: "^(Continue|Fortfahren)$"
    commands:
      - tapOn:
          text: "^(Continue|Fortfahren)$"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "^(Close|Schließen)$"
    commands:
      - tapOn:
          text: "^(Close|Schließen)$"
      - waitForAnimationToEnd
- waitForAnimationToEnd

appId: com.goldjunge91.fam1
env:
  TEST_PASSWORD: ${TEST_PASSWORD || "Passwort123!"}
---
# Atomare Aufgabe: einen neuen Account über die echte UI registrieren und die
# lokale E-Mail-Bestätigung mit dem Inbucket-OTP abschließen.
- runScript:
    file: ../../scripts/auth/generate-registration-data.js
    env:
      TEST_PASSWORD: "${TEST_PASSWORD}"

- tapOn:
    id: "onboarding-account-email"
- inputText: "${output.auth.email}"
- tapOn:
    id: "keyboard.toolbar.next"
- inputText: "${output.auth.password}"
- scrollUntilVisible:
    element:
      id: "onboarding-account-password-confirmation"
    direction: DOWN
- tapOn:
    id: "onboarding-account-password-confirmation"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 10000
- waitForAnimationToEnd
- inputText: "${output.auth.password}"
- tapOn:
    id: "keyboard.toolbar.done"
- tapOn: "Konto erstellen & weiter"

# iOS' eigener Keychain-Dialog ist kein App-UI und kann nach dem Absenden
# erscheinen. Der exakte Match trifft nicht den späteren Profil-Button.
- tapOn:
    text: "^(Später|Not Now)$"
    optional: true

- extendedWaitUntil:
    visible: "^(Bestätigung ausstehend|Später ausfüllen)$"
    timeout: 30000

# Je nach lokaler Supabase-Konfiguration liefert signUp bereits eine Session
# (direkt weiter) oder verlangt zuerst die E-Mail-Bestätigung.
- runFlow:
    when:
      visible: "Bestätigung ausstehend"
    commands:
      - runScript: ../../scripts/auth/read-local-confirmation-code.js
      - tapOn:
          id: "email-verification-code"
      - inputText: "${output.auth.confirmationCode}"
      - tapOn:
          id: "keyboard.toolbar.done"
          optional: true
      - tapOn: "Bestätigen"
      - extendedWaitUntil:
          visible: "Später ausfüllen"
          timeout: 20000

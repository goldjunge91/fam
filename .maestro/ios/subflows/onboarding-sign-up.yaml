appId: com.goldjunge91.fam1
env:
  # An optional TEST_EMAIL makes the registration account reproducible; the
  # generated address remains the standalone default.
  TEST_EMAIL: ${TEST_EMAIL || "maestro-e2e@example.com"}
  TEST_PASSWORD: ${TEST_PASSWORD || "Passwort123!"}
---
# Atomare Aufgabe: einen neuen Account über die echte UI registrieren und die
# lokale E-Mail-Bestätigung mit dem Mailpit-OTP abschließen.
- runScript:
    file: ../../scripts/auth/generate-registration-data.js
    env:
      TEST_PASSWORD: "${TEST_PASSWORD}"
- evalScript: ${output.auth.email = TEST_EMAIL || output.auth.email}
- tapOn:
    id: "sign-up-email"
- inputText: "${output.auth.email}"
- tapOn:
    id: "sign-up-password"
- inputText: "${output.auth.password}"
- scrollUntilVisible:
    element:
      id: "sign-up-password-confirmation"
    direction: DOWN
- tapOn:
    id: "sign-up-password-confirmation"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 10000
- waitForAnimationToEnd
- inputText: "${output.auth.password}"
- tapOn:
    id: "keyboard.toolbar.done"
- tapOn:
    id: "sign-up-submit"
# iOS' eigener Keychain-Dialog ist kein App-UI und kann nach dem Absenden
# erscheinen. Der exakte Match trifft nicht den späteren Profil-Button.
- tapOn:
    text: "^(Später|Not Now)$"
    optional: true
- extendedWaitUntil:
    visible: "^(Bestätigung ausstehend|Später ausfüllen)$"
    timeout: 30000
# Je nach lokaler Supabase-Konfiguration liefert signUp bereits eine Session
# (direkt weiter) oder verlangt zuerst die E-Mail-Bestätigung.
- runFlow:
    when:
      visible: "Bestätigung ausstehend"
    commands:
      - runScript: ../../scripts/auth/read-local-confirmation-code.js
      - setClipboard: "${output.auth.confirmationCode}"
      - tapOn:
          id: "email-verification-code"
          retryTapIfNoChange: true
          waitToSettleTimeoutMs: 10000
      - pasteText
      - copyTextFrom:
          id: "email-verification-code"
      - evalScript: ${output.confirmationCodeInput = maestro.copiedText}
      - assertTrue: ${output.confirmationCodeInput == output.auth.confirmationCode}
      - tapOn:
          text: "^(Done|Fertig)$"
      - waitForAnimationToEnd
      - tapOn: "Bestätigen"
      - extendedWaitUntil:
          visible: "Später ausfüllen"
          timeout: 20000

appId: com.goldjunge91.fam1
env:
  TEST_EMAIL: ${TEST_EMAIL || "maestro-e2e@example.com"}
  TEST_PASSWORD: ${TEST_PASSWORD || "Passwort123!"}
---
# Atomare Aufgabe: einen bestehenden, bestätigten Account im Onboarding anmelden.
# Im Account-Step remountet der Umschalter den Sign-in-Zweig; der direkte
# Sign-in-Zustand darf nur weiterlaufen, wenn die Leerwertprüfung grün ist.
- runFlow:
    when:
      visible: "Ich habe schon ein Konto"
    commands:
      - tapOn: "Ich habe schon ein Konto"
- assertNotVisible: ".*@.*"
- tapOn:
    id: "sign-in-email"
- setClipboard: "${TEST_EMAIL}"
- pasteText
- copyTextFrom:
    id: "sign-in-email"
- evalScript: ${output.signInEmail = maestro.copiedText}
- assertTrue: ${output.signInEmail == TEST_EMAIL}
- tapOn:
    id: "sign-in-password"
- setClipboard: "${TEST_PASSWORD}"
- pasteText
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
# iOS' eigener Keychain-Dialog ist kein App-UI und kann nach dem Absenden
# erscheinen. Der exakte Match verhindert einen Treffer auf spätere App-Buttons.
- extendedWaitUntil:
    visible: "^(Später|Not Now)$"
    timeout: 5000
    optional: true
- tapOn:
    text: "^(Später|Not Now)$"
    optional: true

appId: com.goldjunge91.fam1
---
# Atomare Aufgabe: Welcome-Carousel bis zum Account-Schritt.
- waitForAnimationToEnd
- tapOn:
    point: "50%,60%"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 10000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Geteilte Einkaufsliste"
    timeout: 10000
- tapOn:
    text: "Weiter"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 10000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Privates Kalorien-Tracking"
    timeout: 10000
- tapOn: "Jetzt starten"

appId: com.goldjunge91.fam1
---
# Der vorhandene Dev Client kann das eigentliche Expo-Developer-Menü nach dem
# App-Start verzögert öffnen. Nach dem Dashboard-Signal warten wir deshalb noch
# auf dessen stabiles Signal und schließen nur dann, wenn es wirklich sichtbar ist.
- extendedWaitUntil:
    visible: "Reload"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          id: "xmark"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          notVisible: "Reload"
          timeout: 5000

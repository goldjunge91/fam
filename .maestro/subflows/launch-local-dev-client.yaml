appId: com.goldjunge91.fam
env:
  # Expo Dev Client erwartet die Metro-URL URL-kodiert.
  METRO_MANIFEST_URL: http%3A%2F%2F127.0.0.1%3A8081
---
# Der Deep Link umgeht unzuverlässige mDNS-Erkennung nach clearState.
# Alternativer Host:
# maestro test .maestro/flows -e METRO_MANIFEST_URL=http%3A%2F%2F192.168.1.23%3A8081
- launchApp:
    clearState: true

- openLink: "fam://expo-development-client/?url=${METRO_MANIFEST_URL}"

# iOS kann beim ersten Scheme-Aufruf bestätigen lassen.
- runFlow:
    when:
      visible: 'Open in "fam"'
    commands:
      - tapOn: Open

- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true

- extendedWaitUntil:
    visible: "Weiter"
    timeout: 50000

appId: com.goldjunge91.fam
---
# Der Kaltstart lässt RootNavigator mit session=null neu auf den Auth-Stack routen.
# Benötigt EXPO_PUBLIC_FORCE_ONBOARDING=false.

- runFlow: reach-dashboard-via-sign-in.yaml

- tapOn: "Einstellungen"
- tapOn: "Abmelden"
- assertVisible: "Willkommen"

- launchApp:
    clearState: false

- assertVisible:
    id: "sign-in-email"

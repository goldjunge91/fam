appId: com.goldjunge91.fam1
env:
  TEST_EMAIL: maestro-e2e@example.com
  TEST_PASSWORD: Passwort123!
---
# Geteilter Praefix: frische Install -> Onboarding -> Anmelden mit einem
# bestehenden, bestaetigten Account -> restliche Schritte ueberspringen ->
# Dashboard. Wird per `runFlow` aus anderen Flows wiederverwendet (siehe
# ../flows/session-persists-after-relaunch.yaml, ../flows/sign-out-and-relaunch.yaml).
#
# Liegt bewusst ausserhalb von .maestro/flows/, damit `maestro test
# .maestro/flows` (= `bun run e2e`) diese Datei nicht zusaetzlich als
# eigenstaendigen Test aufgreift - inhaltlich waere das nur eine Dopplung von
# flows/onboarding-sign-in.yaml.
#
# Voraussetzungen: siehe ../flows/onboarding-sign-in.yaml.

- runFlow: launch-local-dev-client.yaml

# Welcome-Carousel: 3 Slides, "Weiter" bis zum letzten mit "Jetzt starten".
- tapOn: "Weiter"
- tapOn: "Weiter"
- tapOn: "Jetzt starten"

# Account-Step: Default-Tab ist "Registrieren" - zu "Anmelden" wechseln.
- tapOn: "Anmelden"
- tapOn:
    id: "onboarding-account-email"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "onboarding-account-password"
- inputText: "${TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Anmelden & weiter"

# iOS' eigener Keychain-Dialog ("Passwort sichern?") kann nach dem Absenden
# erscheinen - kein App-UI, exakter Match damit "Später" nicht versehentlich
# den spaeteren "Später ausfüllen"-Button trifft.
- tapOn:
    text: "^Später$"
    optional: true

# Restliche Schritte sind fuer einen wiederkehrenden Nutzer alle ueberspringbar.
- scrollUntilVisible:
    element: "Später ausfüllen"
- tapOn: "Später ausfüllen" # Profil-Step
- scrollUntilVisible:
    element: "🏠 Neuen Haushalt erstellen"
- tapOn: "🏠 Neuen Haushalt erstellen"
- tapOn:
    id: "onboarding-household-name"
- inputText: "Familie E2E"
- hideKeyboard
- tapOn: "Weiter"
- tapOn: "Überspringen" # Modul-Auswahl
- tapOn: "Jetzt nicht" # Berechtigungen
- tapOn: "Zum Dashboard" # Abschluss-Step

- assertVisible: "Übersicht"

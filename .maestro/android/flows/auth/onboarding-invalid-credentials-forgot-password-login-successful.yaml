appId: com.goldjunge91.fam
env:
  TEST_EMAIL: ${TEST_EMAIL || "maestro-e2e@example.com"}
  TEST_PASSWORD: ${TEST_PASSWORD || "Passwort123!"}
  WRONG_EMAIL: ${WRONG_EMAIL || "maestro-e2e-not-registered@example.com"}
  WRONG_PASSWORD: ${WRONG_PASSWORD || "FalschesPasswort123!"}
---
# Vollständige Journey: beide Credential-Fehler, Passwort-Reset-Anforderung
# und danach erfolgreicher Login bis zum Dashboard.
- runFlow: ../../subflows/launch-local-dev-client.yaml
- runFlow: ../../subflows/onboarding-welcome.yaml

- runFlow:
    file: ../../subflows/onboarding-sign-in-invalid.yaml
    env:
      TEST_EMAIL: "${TEST_EMAIL}"
      TEST_PASSWORD: "${WRONG_PASSWORD}"

- runFlow:
    file: ../../subflows/onboarding-sign-in-invalid.yaml
    env:
      TEST_EMAIL: "${WRONG_EMAIL}"
      TEST_PASSWORD: "${WRONG_PASSWORD}"

- tapOn: "Passwort vergessen"
- tapOn:
    id: "forgot-password-email"
- inputText: "${TEST_EMAIL}"
- hideKeyboard
- tapOn: "Link anfordern"
- assertVisible: "E-Mail unterwegs"
- tapOn: "Zurück zum Onboarding"

- runFlow:
    file: ../../subflows/onboarding-sign-in.yaml
    env:
      TEST_EMAIL: "${TEST_EMAIL}"
      TEST_PASSWORD: "${TEST_PASSWORD}"
- runFlow: ../../subflows/onboarding-finish.yaml
- assertVisible: "^(Übersicht|Overview)$"

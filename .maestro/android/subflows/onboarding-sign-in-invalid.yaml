appId: com.goldjunge91.fam
env:
  TEST_EMAIL: ${TEST_EMAIL || "maestro-e2e@example.com"}
  TEST_PASSWORD: ${TEST_PASSWORD || "FalschesPasswort123!"}
---
# Atomare Aufgabe: genau einen fehlgeschlagenen Loginversuch ausführen und
# die sichere gemeinsame Credential-Fehlermeldung bestätigen.
- tapOn: "Anmelden"
- tapOn:
    id: "onboarding-account-email"
- eraseText
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "onboarding-account-password"
- eraseText
- inputText: "${TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Anmelden & weiter"
- assertVisible: "E-Mail oder Passwort stimmt nicht."

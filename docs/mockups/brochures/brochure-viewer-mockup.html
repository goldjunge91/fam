<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup: Haushaltsapp Angebote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#F8F4EF',
            element: '#FBF7F2',
            selected: '#E9E1E7',
            maintext: '#2D2830',
            subtext: '#786F79',
            border: '#E4DDE3',
            accent: '#705773',
            onAccent: '#FFFFFF'
          },
          boxShadow: {
            'card': '0 4px 6px -1px rgba(89, 64, 89, 0.1), 0 2px 4px -1px rgba(89, 64, 89, 0.06)',
            'popout': '0 25px 50px -12px rgba(42, 31, 44, 0.5)'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    /* 3D Pop-Out Transitions */
    .hotspot {
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hotspot.popped-out {
      transform: scale(1.6) translate(-50%, -50%);
      top: 40% !important;
      left: 50% !important;
      z-index: 50;
      box-shadow: 0 25px 50px -12px rgba(42, 31, 44, 0.5);
      border-radius: 8px;
    }
    
    .glass-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .glass-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    
    .action-panel {
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .action-panel.active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-bg text-maintext h-screen w-screen overflow-hidden flex justify-center items-center">

  <!-- Mobile Device Frame Simulator -->
  <div class="relative w-[390px] h-[844px] bg-bg overflow-hidden shadow-2xl rounded-[40px] border-[8px] border-gray-900 flex flex-col">
    
    <!-- ==================== SCREEN 1: ÜBERSICHT ==================== -->
    <div id="screen-overview" class="absolute inset-0 flex flex-col bg-bg transition-transform duration-300 z-10">
      
      <!-- Header -->
      <div class="pt-14 pb-4 px-6 bg-element border-b border-border shadow-sm flex flex-col gap-4">
        <h1 class="text-2xl font-semibold">Angebote</h1>
        
        <!-- PLZ & Suche -->
        <div class="flex items-center gap-3 bg-bg rounded-xl px-4 py-3 border border-border">
          <svg class="w-5 h-5 text-subtext" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span class="text-maintext font-medium">22043 Hamburg</span>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto pb-20">
        <!-- Favoriten & Märkte -->
        <div class="px-6 py-6">
          <h2 class="text-sm font-semibold text-subtext uppercase tracking-wider mb-4">Deine Märkte</h2>
          <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
            <!-- Favorite Store -->
            <div class="flex flex-col items-center gap-2 min-w-[72px]">
              <div class="w-16 h-16 rounded-2xl bg-white shadow-card flex items-center justify-center relative border-2 border-accent">
                <span class="font-bold text-red-600 text-lg">REWE</span>
                <!-- Heart Badge -->
                <div class="absolute -top-1 -right-1 bg-accent rounded-full p-1 shadow-sm">
                  <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                </div>
              </div>
              <span class="text-xs font-medium">Rewe</span>
            </div>
            
            <div class="flex flex-col items-center gap-2 min-w-[72px]">
              <div class="w-16 h-16 rounded-2xl bg-white shadow-card flex items-center justify-center relative">
                <span class="font-bold text-blue-700 text-lg">ALDI</span>
              </div>
              <span class="text-xs font-medium">Aldi</span>
            </div>

            <div class="flex flex-col items-center gap-2 min-w-[72px]">
              <div class="w-16 h-16 rounded-2xl bg-white shadow-card flex items-center justify-center relative">
                <span class="font-bold text-yellow-500 text-lg">LIDL</span>
              </div>
              <span class="text-xs font-medium">Lidl</span>
            </div>
          </div>
        </div>

        <!-- Prospekte Grid -->
        <div class="px-6">
          <h2 class="text-sm font-semibold text-subtext uppercase tracking-wider mb-4">Aktuelle Prospekte</h2>
          <div class="grid grid-cols-2 gap-4">
            <!-- Brochure Card -->
            <div onclick="openViewer()" class="cursor-pointer group flex flex-col gap-2">
              <div class="rounded-xl overflow-hidden shadow-card border border-border aspect-[3/4] bg-white relative">
                <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=400&h=533" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" />
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/60 to-transparent p-3">
                  <span class="text-white font-semibold text-sm">Gültig bis 30.08.</span>
                </div>
              </div>
              <span class="font-medium">REWE Center</span>
            </div>
            
            <div class="cursor-pointer group flex flex-col gap-2">
              <div class="rounded-xl overflow-hidden shadow-card border border-border aspect-[3/4] bg-selected flex items-center justify-center">
                <span class="text-subtext">Kaufland...</span>
              </div>
              <span class="font-medium">Kaufland</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== SCREEN 2: PROSPEKT VIEWER ==================== -->
    <div id="screen-viewer" class="absolute inset-0 bg-black translate-x-full transition-transform duration-300 z-20 flex flex-col">
      
      <!-- Top Bar (Floating) -->
      <div class="absolute top-0 inset-x-0 pt-14 pb-4 px-4 bg-gradient-to-b from-black/70 to-transparent z-30 flex items-center justify-between">
        <button onclick="closeViewer()" class="w-10 h-10 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <span class="text-white font-medium text-sm px-3 py-1 bg-black/40 backdrop-blur-md rounded-full">Seite 1 / 24</span>
        <button class="w-10 h-10 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
        </button>
      </div>

      <!-- Brochure Image Container (Simulates react-native-pager-view) -->
      <div class="flex-1 relative">
        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=800&h=1200" class="w-full h-full object-cover" />
        
        <!-- Interactive Hotspot 1 -->
        <div id="hotspot-1" onclick="popOut(this)" class="hotspot absolute border-2 border-white/40 bg-white/10 rounded-lg cursor-pointer flex items-end justify-center pb-2" 
             style="top: 20%; left: 10%; width: 40%; height: 25%;">
             <!-- Dummy text to simulate product on page -->
             <div class="bg-red-600 text-white font-bold px-2 py-1 rounded text-xs rotate-[-5deg] shadow-lg">-30%</div>
        </div>
        
        <!-- Interactive Hotspot 2 -->
        <div id="hotspot-2" onclick="popOut(this)" class="hotspot absolute border-2 border-white/40 bg-white/10 rounded-lg cursor-pointer" 
             style="top: 50%; left: 55%; width: 35%; height: 30%;">
        </div>
      </div>

      <!-- Glass Overlay (Hidden by default, shown on pop-out) -->
      <div id="glass-overlay" class="glass-overlay absolute inset-0 bg-black/60 backdrop-blur-md z-40" onclick="closePopOut()"></div>

      <!-- Action Panel (Bottom sheet for the pop-out) -->
      <div id="action-panel" class="action-panel absolute bottom-0 inset-x-0 bg-element rounded-t-[32px] pt-6 pb-10 px-6 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.3)]">
        <div class="flex flex-col gap-6">
          <div class="flex items-start justify-between">
            <div>
              <h3 class="text-xl font-bold text-maintext">Frische Bio-Tomaten</h3>
              <p class="text-subtext">500g Packung (1kg = 3,98€)</p>
            </div>
            <div class="text-right">
              <span class="text-2xl font-bold text-accent">1,99 €</span>
              <p class="text-sm text-subtext line-through">2,49 €</p>
            </div>
          </div>
          
          <div class="flex items-center gap-4">
            <!-- Stepper -->
            <div class="flex items-center bg-bg rounded-2xl border border-border p-1">
              <button class="w-10 h-10 flex items-center justify-center text-maintext font-bold text-xl">-</button>
              <span class="w-8 text-center font-semibold">1</span>
              <button class="w-10 h-10 flex items-center justify-center text-maintext font-bold text-xl">+</button>
            </div>
            <!-- Add Button -->
            <button onclick="addToCart()" class="flex-1 bg-accent text-onAccent font-semibold rounded-2xl py-4 flex items-center justify-center gap-2 active:scale-95 transition-transform">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              Auf die Einkaufsliste
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let activeHotspot = null;
    let originalStyle = '';

    function openViewer() {
      document.getElementById('screen-overview').classList.add('-translate-x-1/4', 'opacity-50');
      document.getElementById('screen-viewer').classList.remove('translate-x-full');
    }

    function closeViewer() {
      document.getElementById('screen-overview').classList.remove('-translate-x-1/4', 'opacity-50');
      document.getElementById('screen-viewer').classList.add('translate-x-full');
    }

    function popOut(element) {
      if(activeHotspot) return;
      activeHotspot = element;
      
      // Save original inline styles (top, left, width, height)
      originalStyle = element.getAttribute('style');
      
      // Add fake content to simulate the high-res crop
      element.innerHTML = '<img src="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover rounded-md shadow-inner" /><div class="absolute -top-3 -right-3 bg-red-600 text-white font-bold px-3 py-1 rounded-full text-sm rotate-[10deg] shadow-lg">-20%</div>';
      element.classList.remove('border-white/40', 'bg-white/10');
      element.classList.add('popped-out', 'bg-white', 'p-2');
      
      // Show glass background & bottom sheet
      document.getElementById('glass-overlay').classList.add('active');
      document.getElementById('action-panel').classList.add('active');
    }

    function closePopOut() {
      if(!activeHotspot) return;
      
      // Revert styles
      activeHotspot.setAttribute('style', originalStyle);
      activeHotspot.classList.remove('popped-out', 'bg-white', 'p-2');
      activeHotspot.classList.add('border-white/40', 'bg-white/10');
      
      // Remove fake content
      if (activeHotspot.id === 'hotspot-1') {
        activeHotspot.innerHTML = '<div class="bg-red-600 text-white font-bold px-2 py-1 rounded text-xs rotate-[-5deg] shadow-lg">-30%</div>';
      } else {
        activeHotspot.innerHTML = '';
      }
      
      document.getElementById('glass-overlay').classList.remove('active');
      document.getElementById('action-panel').classList.remove('active');
      activeHotspot = null;
    }

    function addToCart() {
      // Simulate adding
      const btn = document.querySelector('#action-panel button.bg-accent');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Hinzugefügt';
      btn.classList.add('bg-green-600');
      
      setTimeout(() => {
        closePopOut();
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('bg-green-600');
        }, 300);
      }, 800);
    }
  </script>
</body>
</html>

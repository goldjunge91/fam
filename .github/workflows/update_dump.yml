name: Open Food Facts Dump Update

# Nicht manuell starten, solange der Client noch ein beliebiges .db-Asset lädt.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  CANONICAL_TAG: off-dump-current

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install orjson requests

      - name: Download previous canonical state
        id: previous
        run: |
          mkdir -p previous out
          if gh release view "$CANONICAL_TAG" >/dev/null 2>&1; then
            gh release download "$CANONICAL_TAG" --dir previous --pattern 'canonical.db' --pattern 'manifest.json' --clobber || true
          fi
          if [ -f previous/canonical.db ] && [ -f previous/manifest.json ]; then
            echo "has_previous=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify or reconstruct previous canonical state
        if: steps.previous.outputs.has_previous == 'true'
        run: |
          set -euo pipefail
          if sqlite3 previous/canonical.db 'PRAGMA quick_check;' | grep -qx ok; then
            echo "previous/canonical.db: quick_check ok, keine Rekonstruktion noetig."
            exit 0
          fi

          echo "previous/canonical.db: quick_check fehlgeschlagen — rekonstruiere aus Baseline + Patchkette."
          baseline_url=$(jq -r '.baseline.url' previous/manifest.json)
          curl -fsSL -o previous/baseline.db "$baseline_url"

          patch_files=()
          while IFS= read -r url; do
            fname="patch-$(basename "$url")"
            curl -fsSL -o "previous/$fname" "$url"
            patch_files+=("previous/$fname")
          done < <(jq -r '.patches[].url' previous/manifest.json)

          bun run scripts/dump_data/reconstruct-canonical.ts \
            --baseline previous/baseline.db \
            --patches "${patch_files[@]}" \
            --out previous/canonical.db \
            --expect-data-version "$(jq -r '.latestVersion' previous/manifest.json)"

      - name: Run Dump Generator
        run: python scripts/dump_data/create_custom_dump.py

      - name: Build canonical update
        run: |
          args=(
            --new-extract scripts/dump_data/products_de.db
            --out-dir out
            --base-url "https://github.com/${{ github.repository }}/releases/download/${CANONICAL_TAG}"
          )
          if [ -f previous/canonical.db ] && [ -f previous/manifest.json ]; then
            args+=(--old-canonical previous/canonical.db --previous-manifest previous/manifest.json)
          fi
          bun run scripts/dump_data/build-canonical-update.ts "${args[@]}"

      - name: Ensure canonical release exists
        run: |
          gh release view "$CANONICAL_TAG" >/dev/null 2>&1 || \
            gh release create "$CANONICAL_TAG" \
              --title "Offline-Produktkatalog (aktuell)" \
              --notes "Rollierender kanonischer Dump + Patchkette fuer den Offline-Produktkatalog (#223). Nicht als normales App-Release verwenden." \
              --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Datenassets müssen vor dem referenzierenden Manifest online sein.
      - name: Publish data assets
        run: |
          gh release upload "$CANONICAL_TAG" out/canonical.db --clobber
          shopt -s nullglob
          for f in out/baseline-*.db out/patch-*.db; do
            gh release upload "$CANONICAL_TAG" "$f" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        run: gh release upload "$CANONICAL_TAG" out/manifest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

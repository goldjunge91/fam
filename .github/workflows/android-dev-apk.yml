name: Android Dev APK Build

on:
  workflow_dispatch:
    inputs:
      approve_rebuild:
        description: "Native APK-Rebuild ausdrücklich freigeben"
        required: true
        default: false
        type: boolean

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Setup Java 17 & Expo
        uses: ./.github/actions/setup-expo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: |
          if [ "${{ inputs.approve_rebuild }}" != "true" ]; then
            echo "Native APK-Rebuild nicht freigegeben"
            exit 1
          fi
          bun run android:apk -- --approve-rebuild
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fam-android-dev-apk-${{ github.sha }}
          path: "dist/*.apk"
          retention-days: 7

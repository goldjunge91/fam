name: iOS Offline Network Spike

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
  EXPO_PUBLIC_DEV_TOOLS: ${{ vars.EXPO_PUBLIC_DEV_TOOLS || 'true' }}
  EXPO_PUBLIC_DEBUG_LOGS: ${{ vars.EXPO_PUBLIC_DEBUG_LOGS || 'true' }}
  EXPO_PUBLIC_OFF_OFFLINE: ${{ vars.EXPO_PUBLIC_OFF_OFFLINE || 'false' }}
  EXPO_PUBLIC_FORCE_ONBOARDING: ${{ vars.EXPO_PUBLIC_FORCE_ONBOARDING || 'false' }}
  EXPO_PUBLIC_FORCE_PREMIUM: ${{ vars.EXPO_PUBLIC_FORCE_PREMIUM || 'false' }}
  EXPO_PUBLIC_REVENUECAT_TEST_STORE_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_TEST_STORE_API_KEY }}
  EXPO_PUBLIC_APTABASE_APP_KEY: ${{ vars.EXPO_PUBLIC_APTABASE_APP_KEY }}
  EXPO_PUBLIC_POSTHOG_API_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
  EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
  EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
  FAM_HARNESS_UI: "1"

jobs:
  build:
    name: Build iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      artifact_id: ${{ steps.build.outputs.artifact_id }}
      artifact_url: ${{ steps.build.outputs.artifact_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and upload simulator artifact
        id: build
        uses: ./.github/actions/ios-simulator-build
        with:
          artifact-name: fam-ios-offline-simulator-${{ github.sha }}
          artifact-retention-days: "7"

  offline:
    name: Launch installed app offline
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Download simulator app artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/fam-ios-offline-artifact

      - name: Run offline runtime
        id: offline_runtime
        uses: ./.github/actions/ios-offline-runtime
        with:
          app-path: ${{ runner.temp }}/fam-ios-offline-artifact/fam.app.tar.gz

      - name: Upload Metro log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-offline-network-spike-metro-log-${{ github.run_id }}
          path: ${{ runner.temp }}/fam-ios-metro.log
          retention-days: 7
          if-no-files-found: ignore

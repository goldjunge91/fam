name: iOS Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS Build Profile
        required: true
        default: preview-testflight
        type: choice
        options:
          - preview-testflight
          - production
      approve_rebuild:
        description: Native Release-Rebuild ausdrücklich freigeben
        required: true
        default: false
        type: boolean

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  release-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-26

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
      POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Setup Expo & EAS
        uses: ./.github/actions/setup-expo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA via EAS
        run: |
          if [ "${{ inputs.approve_rebuild }}" != "true" ]; then
            echo "Native iOS-Rebuild nicht freigegeben"
            exit 1
          fi
          mkdir -p dist

          eas build \
            --local \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --output dist/fam.ipa

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: dist/fam.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

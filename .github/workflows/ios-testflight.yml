name: iOS Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS Build Profile
        required: true
        default: preview-testflight
        type: choice
        options:
          - preview-testflight
          - production
      approve_rebuild:
        description: Native Release-Rebuild ausdrücklich freigeben
        required: true
        default: false
        type: boolean

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  release-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-26

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
      POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
      FAM_HARNESS_UI: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Build iOS IPA via EAS
        id: build
        run: |
          if [[ "$APPROVE_REBUILD" != "true" ]]; then
            echo "Native iOS-Rebuild nicht freigegeben"
            exit 1
          fi
          case "$EAS_PROFILE" in
            preview-testflight|production) ;;
            *) echo "Nicht unterstütztes iOS-Profil: $EAS_PROFILE" >&2; exit 2 ;;
          esac

          bun run eas:ios:local -- "$EAS_PROFILE" --output "build/local/eas/$EAS_PROFILE/fam.ipa"
          archive_path="$(find "$HOME/Library/Developer/Xcode/Archives" -type d -name '*.xcarchive' -prune -print -quit)"
          if [[ -z "$archive_path" ]]; then
            echo "Kein Xcode-Archiv unter ~/Library/Developer/Xcode/Archives gefunden" >&2
            exit 1
          fi
          ditto "$archive_path" "build/local/eas/$EAS_PROFILE/fam.xcarchive"
        env:
          APPROVE_REBUILD: ${{ inputs.approve_rebuild }}
          EAS_PROFILE: ${{ inputs.profile }}
          EAS_LOCAL_BUILD_ROOT: ${{ runner.temp }}/eas-local

      - name: Submit IPA to TestFlight via EAS
        run: >-
          bun x eas-cli submit --platform ios --profile "$EAS_PROFILE"
          --path "build/local/eas/$EAS_PROFILE/fam.ipa" --non-interactive
        env:
          EAS_PROFILE: ${{ inputs.profile }}

      - name: Archive IPA and Xcode archive
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ inputs.profile }}-${{ github.run_number }}
          path: |
            build/local/eas/${{ inputs.profile }}/fam.ipa
            build/local/eas/${{ inputs.profile }}/fam.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Archive iOS build lifecycle records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-lifecycle-${{ github.run_number }}
          path: build/workflows/ios/
          if-no-files-found: warn
          retention-days: 90

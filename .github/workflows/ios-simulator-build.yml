name: iOS Simulator Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator App
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Build iOS simulator app
        shell: bash
        run: |
          set -o pipefail
          bun run build:simulator 2>&1 | tee "${{ runner.temp }}/ios-simulator-build.log"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ROOT: ${{ runner.temp }}/eas-local

      - name: Package iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          artifact_path="$(sed -n 's/^Artefakt: //p' "${{ runner.temp }}/ios-simulator-build.log" | tail -n 1)"
          [[ -n "$artifact_path" ]]

          packaging_dir="${{ runner.temp }}/fam-ios-simulator-packaging"
          rm -rf "$packaging_dir"
          mkdir -p "$packaging_dir"

          if [[ -f "$artifact_path" ]]; then
            extract_dir="${{ runner.temp }}/ios-simulator-artifact"
            mkdir -p "$extract_dir"
            tar -xzf "$artifact_path" -C "$extract_dir"
            iphone_app="$extract_dir/Debug-iphonesimulator/fam.app"
            watch_app="$extract_dir/Debug-watchsimulator/watch.app"
            [[ -d "$iphone_app" ]]
            [[ -d "$watch_app" ]]
          elif [[ -d "$artifact_path" && "$artifact_path" == *.app ]]; then
            iphone_app="$artifact_path"
            watch_app="$(find \
              "$(dirname "$artifact_path")" \
              "$(dirname "$(dirname "$artifact_path")")" \
              -type d \
              -path '*/Debug-watchsimulator/watch.app' \
              -print -quit 2>/dev/null)"
            if [[ -z "$watch_app" ]]; then
              echo "Missing Debug-watchsimulator/watch.app for directory artifact: $artifact_path" >&2
              exit 1
            fi
          else
            exit 1
          fi

          ditto "$iphone_app" "$packaging_dir/fam.app"
          ditto "$watch_app" "$packaging_dir/watch.app"
          tar -czf "${{ runner.temp }}/fam-ios-simulator.tar.gz" \
            -C "$packaging_dir" \
            fam.app \
            watch.app

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v7
        with:
          name: fam-ios-simulator
          path: ${{ runner.temp }}/fam-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7

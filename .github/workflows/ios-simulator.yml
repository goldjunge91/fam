name: iOS Simulator Build

on:
  workflow_dispatch:

concurrency:
  group: ios-sim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Build iOS Simulator App
    runs-on: macos-26
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_DEV_TOOLS: ${{ vars.EXPO_PUBLIC_DEV_TOOLS || 'true' }}
      EXPO_PUBLIC_DEBUG_LOGS: ${{ vars.EXPO_PUBLIC_DEBUG_LOGS || 'true' }}
      EXPO_PUBLIC_OFF_OFFLINE: ${{ vars.EXPO_PUBLIC_OFF_OFFLINE || 'false' }}
      EXPO_PUBLIC_FORCE_ONBOARDING: ${{ vars.EXPO_PUBLIC_FORCE_ONBOARDING || 'false' }}
      EXPO_PUBLIC_FORCE_PREMIUM: ${{ vars.EXPO_PUBLIC_FORCE_PREMIUM || 'false' }}
      EXPO_PUBLIC_REVENUECAT_TEST_STORE_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_TEST_STORE_API_KEY }}
      EXPO_PUBLIC_APTABASE_APP_KEY: ${{ vars.EXPO_PUBLIC_APTABASE_APP_KEY }}
      EXPO_PUBLIC_POSTHOG_API_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Setup Expo & EAS
        uses: ./.github/actions/setup-expo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify locked native baseline
        run: bun run native:status

      - name: Restore locked iOS Simulator artifact
        run: bun run native:restore -- --target ios-development-simulator

      - name: Install locked iOS Simulator App
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | grep -m1 -E 'iPhone 17 Pro \\(' | grep -oE '[0-9A-F-]{36}' || true)"
          if [ -z "$DEVICE_ID" ]; then
            echo "Kein verfügbarer iPhone 17 Pro Simulator gefunden"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" native-artifacts/ios-development-simulator/fam.app

      - name: Package Simulator App (.tar.gz)
        run: |
          APP_PATH="native-artifacts/ios-development-simulator/fam.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Fehler: fam.app wurde nicht gefunden"
            exit 1
          fi
          mkdir -p dist
          tar -C "$(dirname "$APP_PATH")" -czf dist/fam-simulator.app.tar.gz "$(basename "$APP_PATH")"

      - name: Upload Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fam-ios-simulator-${{ github.sha }}
          path: dist/fam-simulator.app.tar.gz
          retention-days: 7

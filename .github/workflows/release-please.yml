name: Release Please

on:
  workflow_dispatch:
    inputs:
      approve_rebuild:
        description: "Native Store-Rebuilds ausdrücklich freigeben"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
  release2play-internal-test-track:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created && inputs.approve_rebuild == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-env
      - uses: ./.github/actions/setup-expo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Build aab
        run: |
          mkdir -p build/cache/eas build/local/eas/android-production
          eas_workingdir="$(mktemp -d "$GITHUB_WORKSPACE/build/cache/eas/android-production.XXXXXXXX")"
          export EAS_LOCAL_BUILD_WORKINGDIR="$eas_workingdir"
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$GITHUB_WORKSPACE/build/local/eas/android-production"
          bun x eas-cli build --local -p android --profile production --non-interactive --output build/local/eas/android-production/app-release.aab
      - name: Upload to Play Store Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.goldjunge91.fam
          releaseFiles: app-release.aab
          track: internal
          status: draft
          inAppUpdatePriority: 2
  release2testflight:
    needs: release-please
    runs-on: macos-14
    if: ${{ needs.release-please.outputs.release_created && inputs.approve_rebuild == true }}
    env:
      FAM_HARNESS_UI: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-env
      - name: Build iOS app
        id: build
        run: |
          bun run eas:ios:local -- production --output build/local/eas/production/fam.ipa
          archive_path="$(find "$HOME/Library/Developer/Xcode/Archives" -type d -name '*.xcarchive' -prune -print -quit)"
          if [[ -z "$archive_path" ]]; then
            echo "Kein Xcode-Archiv unter ~/Library/Developer/Xcode/Archives gefunden" >&2
            exit 1
          fi
          ditto "$archive_path" build/local/eas/production/fam.xcarchive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ROOT: ${{ runner.temp }}/eas-local
      - name: Submit IPA to TestFlight via EAS
        run: >-
          bun x eas-cli submit --platform ios --profile production
          --path build/local/eas/production/fam.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Archive IPA and Xcode archive
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-production-${{ github.run_number }}
          path: |
            build/local/eas/production/fam.ipa
            build/local/eas/production/fam.xcarchive
          if-no-files-found: error
          retention-days: 7

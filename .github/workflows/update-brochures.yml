name: Brochure Metadata Catalog Update

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Only retry Supabase metadata publication from a completed source run in this repository'
        required: false
        type: string
        default: ''
      detail_retry_run_id:
        description: 'Retry only detail metadata using a failed source run with successful scan artifacts'
        required: false
        type: string
        default: ''

  schedule:
    # Montag und Donnerstag: Bring-Wochenangebote vollständig aktualisieren.
    - cron: "17 4 * * 1"
    - cron: "17 4 * * 4"

concurrency:
  # A single writer protects the shared app catalog.
  group: brochure-catalog-update-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

# Operator instructions:
# - After a scan-leg failure, use GitHub's "Re-run failed jobs". The failed ZIP
#   legs and merge gates retry while successful scan shards remain available.
# - The listing scan stores Bring CDN URLs as metadata. It does not download or
#   upload image bytes. Detail-page JSON is fetched once per unique BRN because
#   the listing response exposes only the cover page. ZIP visibility still comes
#   only from each ZIP's own listing.
# - Detail metadata progress is cached per run and attempt. Re-running the failed
#   detail job resumes completed BRNs and retries failures.
# - To avoid rerunning PLZ scans after a detail failure, dispatch this workflow
#   with detail_retry_run_id set to the failed source run. It validates and uses
#   that run's scan artifacts and saved progress, then stops after detail output.
# - After persistence, reporting, or handoff fails, use "Re-run failed jobs".
#   Successful predecessor phases and their immutable artifacts stay in place.
# - After Supabase metadata publication fails, use workflow_dispatch with
#   resume_run_id set to the failed source run. The publisher consumes that
#   source's unchanged metadata handoff and does not repeat any Bring calls.
# - A resume source must be a completed run of this repository and workflow with
#   every producer job successful and only the Supabase publisher unsuccessful.
# - If a required artifact is missing, expired, foreign, changed, or unverifiable,
#   stop. The resume path fails closed and never falls back to a new scan.

jobs:
  validate-secrets:
    name: Crawler-Zugangsdaten prüfen
    if: ${{ inputs.resume_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate required secrets
        env:
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
          BRING_AUTH_TOKEN: ${{ secrets.BRING_AUTH_TOKEN }}
          BRING_API_KEY: ${{ secrets.BRING_API_KEY }}
          BRING_USER_UUID: ${{ secrets.BRING_USER_UUID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${BRING_EMAIL:-}" ] && [ -n "${BRING_PASSWORD:-}" ]; then
            echo "Bring headless login is configured."
          elif [ -n "${BRING_AUTH_TOKEN:-}" ] && [ -n "${BRING_API_KEY:-}" ] && [ -n "${BRING_USER_UUID:-}" ]; then
            echo "Static Bring credentials are configured."
          else
            printf '::error::Configure Bring email/password or all three static Bring tokens.\n'
            exit 1
          fi

          required=(SUPABASE_URL SUPABASE_SECRET_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing Supabase metadata publication secrets: %s\n' "${missing[*]}"
            exit 1
          fi

  validate-detail-retry-source:
    name: Detail-Retry-Quelle prüfen
    if: ${{ inputs.detail_retry_run_id != '' && inputs.resume_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.validate.outputs.run_id }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
    steps:
      - name: Validate failed detail source run
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.detail_retry_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            printf '::error::detail_retry_run_id must be a positive numeric run ID.\n'
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          if ! jq -e --arg repository "$GITHUB_REPOSITORY" '
            .repository.full_name == $repository and
            .path == ".github/workflows/update-brochures.yml" and
            .head_branch == "main" and
            .status == "completed" and
            .conclusion == "failure"
          ' <<<"$run_json" >/dev/null; then
            printf '::error::Detail retry source must be a failed, completed run of this workflow on main.\n'
            exit 1
          fi

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"
          if ! jq -e '
            def has_result($name; $result): any(.jobs[]; .name == $name and .conclusion == $result);
            has_result("Crawler-Zugangsdaten prüfen"; "success") and
            has_result("Eingaben vorbereiten"; "success") and
            has_result("PLZ-Scan zusammenführen"; "success") and
            has_result("Detail-Metadaten laden"; "failure") and
            ([.jobs[] | select(.name | startswith("PLZ-Scan Shard "))] | length == 4 and all(.[]; .conclusion == "success")) and
            ([.jobs[] | select(.conclusion == "failure") | .name] == ["Detail-Metadaten laden"])
          ' <<<"$jobs_json" >/dev/null; then
            printf '::error::Detail retry source must have successful scan phases and only the detail job failed.\n'
            exit 1
          fi

          printf 'run_id=%s\n' "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$(jq -r '.head_sha' <<<"$run_json")" >> "$GITHUB_OUTPUT"

  prepare-inputs:
    name: Eingaben vorbereiten
    needs: validate-secrets
    if: >-
      ${{ always() && inputs.resume_run_id == '' &&
          inputs.detail_retry_run_id == '' &&
          github.ref == 'refs/heads/main' &&
          needs.validate-secrets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.create-manifest.outputs.manifest_sha256 }}
      predecessor_manifest_sha256: ${{ steps.create-manifest.outputs.predecessor_manifest_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Cache GeoNames postal codes
        id: cache-geonames
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/geonames-DE.txt
          key: geonames-de-postal-codes-v1

      - name: Download German postal codes
        if: ${{ steps.cache-geonames.outputs.cache-hit != 'true' }}
        run: |
          curl --fail --silent --show-error --location \
            https://download.geonames.org/export/zip/DE.zip \
            --output "${RUNNER_TEMP}/geonames-DE.zip"
          unzip -p "${RUNNER_TEMP}/geonames-DE.zip" DE.txt > "${RUNNER_TEMP}/geonames-DE.txt"

      - name: Verify postal-code input
        run: test -s "${RUNNER_TEMP}/geonames-DE.txt"

      - name: Create input phase artifact
        id: create-manifest
        run: |
          artifact_dir="${RUNNER_TEMP}/brochure-prepare-inputs"
          mkdir -p "$artifact_dir"
          cp "${RUNNER_TEMP}/geonames-DE.txt" "$artifact_dir/geonames-DE.txt"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts create \
            --phase=prepare-inputs \
            --artifact-dir="$artifact_dir" \
            --files=geonames-DE.txt

      - name: Upload input phase artifact
        uses: actions/upload-artifact@v4
        with:
          name: brochure-prepare-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-prepare-inputs/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  scan-locations:
    name: PLZ-Scan Shard ${{ matrix.shard }}
    needs: [validate-secrets, prepare-inputs]
    if: >-
      ${{ always() && inputs.resume_run_id == '' &&
          inputs.detail_retry_run_id == '' &&
          github.ref == 'refs/heads/main' &&
          needs.validate-secrets.result == 'success' &&
          needs.prepare-inputs.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Download prepared inputs
        uses: actions/download-artifact@v5
        with:
          name: brochure-prepare-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-prepare-inputs

      - name: Validate prepared input artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=prepare-inputs
          --artifact-dir="${RUNNER_TEMP}/brochure-prepare-inputs"
          --files=geonames-DE.txt
          --manifest-sha256="${{ needs.prepare-inputs.outputs.manifest_sha256 }}"

      - name: Authenticate with Bring
        env:
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
          BRING_AUTH_TOKEN: ${{ secrets.BRING_AUTH_TOKEN }}
          BRING_API_KEY: ${{ secrets.BRING_API_KEY }}
          BRING_USER_UUID: ${{ secrets.BRING_USER_UUID }}
        run: |
          if [ -n "$BRING_EMAIL" ] && [ -n "$BRING_PASSWORD" ]; then
            bun run scripts/bring-auth.ts
          else
            {
              echo "BRING_AUTH_TOKEN=$BRING_AUTH_TOKEN"
              echo "BRING_API_KEY=$BRING_API_KEY"
              echo "BRING_USER_UUID=$BRING_USER_UUID"
            } >> "$GITHUB_ENV"
          fi

      - name: Scan assigned German postal codes
        env:
          BROCHURE_LOCATIONS_FILE: ${{ runner.temp }}/brochure-prepare-inputs/geonames-DE.txt
        run: >-
          bun run tools/crawler/brochures/listing-only/all-stores-full.ts
          --shard-index=${{ matrix.shard }}
          --shard-count=4
          --output="${RUNNER_TEMP}/all-stores-full.json"

      - name: Create scan shard artifact
        run: |
          artifact_dir="${RUNNER_TEMP}/brochure-scan-${{ matrix.shard }}"
          mkdir -p "$artifact_dir"
          cp "${RUNNER_TEMP}/all-stores-full.json" "$artifact_dir/all-stores-full.json"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts create \
            --phase=scan-locations \
            --artifact-dir="$artifact_dir" \
            --files=all-stores-full.json \
            --predecessor-manifest-sha256="${{ needs.prepare-inputs.outputs.manifest_sha256 }}" \
            --shard-index=${{ matrix.shard }} \
            --shard-count=4

      - name: Upload scan shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: brochure-scan-locations-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/brochure-scan-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  scan-merge:
    # The merge requires all four exact ZIP shards and rejects gaps or overlap.
    name: PLZ-Scan zusammenführen
    needs: [validate-secrets, prepare-inputs, scan-locations]
    if: >-
      ${{ always() && inputs.resume_run_id == '' &&
          inputs.detail_retry_run_id == '' &&
          github.ref == 'refs/heads/main' &&
          needs.validate-secrets.result == 'success' &&
          needs.prepare-inputs.result == 'success' &&
          needs.scan-locations.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.create-manifest.outputs.manifest_sha256 }}
      predecessor_manifest_sha256: ${{ steps.create-manifest.outputs.predecessor_manifest_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Download prepared inputs
        uses: actions/download-artifact@v5
        with:
          name: brochure-prepare-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-prepare-inputs

      - name: Validate prepared input artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=prepare-inputs
          --artifact-dir="${RUNNER_TEMP}/brochure-prepare-inputs"
          --files=geonames-DE.txt
          --manifest-sha256="${{ needs.prepare-inputs.outputs.manifest_sha256 }}"

      - name: Download scan shard 0
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-locations-${{ github.run_id }}-0
          path: ${{ runner.temp }}/brochure-scan-shards/0

      - name: Download scan shard 1
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-locations-${{ github.run_id }}-1
          path: ${{ runner.temp }}/brochure-scan-shards/1

      - name: Download scan shard 2
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-locations-${{ github.run_id }}-2
          path: ${{ runner.temp }}/brochure-scan-shards/2

      - name: Download scan shard 3
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-locations-${{ github.run_id }}-3
          path: ${{ runner.temp }}/brochure-scan-shards/3

      - name: Merge and verify the four scan shards
        id: merge-shards
        run: >-
          bun run tools/crawler/brochures/listing-only/scan-shard-artifact.ts merge
          --shards-dir="${RUNNER_TEMP}/brochure-scan-shards"
          --output="${RUNNER_TEMP}/all-stores-full.json"
          --predecessor-manifest-sha256="${{ needs.prepare-inputs.outputs.manifest_sha256 }}"

      - name: Create scan merge artifact
        id: create-manifest
        run: |
          artifact_dir="${RUNNER_TEMP}/brochure-scan-merge"
          mkdir -p "$artifact_dir"
          cp "${RUNNER_TEMP}/all-stores-full.json" "$artifact_dir/all-stores-full.json"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts create \
            --phase=scan-merge \
            --artifact-dir="$artifact_dir" \
            --files=all-stores-full.json \
            --predecessor-manifest-sha256="${{ needs.prepare-inputs.outputs.manifest_sha256 }},${{ steps.merge-shards.outputs.predecessor_manifest_sha256 }}"

      - name: Upload scan merge artifact
        uses: actions/upload-artifact@v4
        with:
          name: brochure-scan-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-scan-merge/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  detail-pages:
    name: Detail-Metadaten laden
    needs: [validate-secrets, validate-detail-retry-source, prepare-inputs, scan-merge]
    if: >-
      ${{ always() && inputs.resume_run_id == '' &&
          github.ref == 'refs/heads/main' &&
          needs.validate-secrets.result == 'success' &&
          ((inputs.detail_retry_run_id == '' &&
            needs.prepare-inputs.result == 'success' &&
            needs.scan-merge.result == 'success') ||
           (inputs.detail_retry_run_id != '' &&
            needs.validate-detail-retry-source.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      manifest_sha256: ${{ steps.create-manifest.outputs.manifest_sha256 }}
      predecessor_manifest_sha256: ${{ steps.create-manifest.outputs.predecessor_manifest_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Download prepared inputs
        if: ${{ inputs.detail_retry_run_id == '' }}
        uses: actions/download-artifact@v5
        with:
          name: brochure-prepare-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-prepare-inputs

      - name: Download prepared inputs from source run
        if: ${{ inputs.detail_retry_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          name: brochure-prepare-inputs-${{ inputs.detail_retry_run_id }}
          path: ${{ runner.temp }}/brochure-prepare-inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.detail_retry_run_id }}

      - name: Validate prepared input artifact
        if: ${{ inputs.detail_retry_run_id == '' }}
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=prepare-inputs
          --artifact-dir="${RUNNER_TEMP}/brochure-prepare-inputs"
          --files=geonames-DE.txt
          --manifest-sha256="${{ needs.prepare-inputs.outputs.manifest_sha256 }}"

      - name: Download scan merge artifact
        if: ${{ inputs.detail_retry_run_id == '' }}
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-scan-merge

      - name: Download scan merge artifact from source run
        if: ${{ inputs.detail_retry_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-merge-${{ inputs.detail_retry_run_id }}
          path: ${{ runner.temp }}/brochure-scan-merge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.detail_retry_run_id }}

      - name: Read source phase artifact digests
        id: source-manifests
        if: ${{ inputs.detail_retry_run_id != '' }}
        run: |
          prepare_manifest="${RUNNER_TEMP}/brochure-prepare-inputs/phase-artifact.json"
          scan_manifest="${RUNNER_TEMP}/brochure-scan-merge/phase-artifact.json"
          prepare_digest="$(sha256sum "$prepare_manifest" | cut -d' ' -f1)"
          scan_predecessors="$(jq -er --arg prepare "$prepare_digest" '
            select((.predecessorManifestSha256 | length) == 5 and
              (.predecessorManifestSha256 | index($prepare)) != null) |
            .predecessorManifestSha256 | join(",")
          ' "$scan_manifest")"
          printf 'prepare_manifest_sha256=%s\n' "$prepare_digest" >> "$GITHUB_OUTPUT"
          printf 'scan_manifest_sha256=%s\n' "$(sha256sum "$scan_manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'scan_predecessor_manifest_sha256=%s\n' "$scan_predecessors" >> "$GITHUB_OUTPUT"

      - name: Validate scan merge artifact
        if: ${{ inputs.detail_retry_run_id == '' }}
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=scan-merge
          --artifact-dir="${RUNNER_TEMP}/brochure-scan-merge"
          --files=all-stores-full.json
          --manifest-sha256="${{ needs.scan-merge.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.scan-merge.outputs.predecessor_manifest_sha256 }}"

      - name: Validate prepared input artifact from source run
        if: ${{ inputs.detail_retry_run_id != '' }}
        run: >-
          GITHUB_RUN_ID="${{ needs.validate-detail-retry-source.outputs.run_id }}"
          GITHUB_SHA="${{ needs.validate-detail-retry-source.outputs.commit_sha }}"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=prepare-inputs
          --artifact-dir="${RUNNER_TEMP}/brochure-prepare-inputs"
          --files=geonames-DE.txt
          --manifest-sha256="${{ steps.source-manifests.outputs.prepare_manifest_sha256 }}"

      - name: Validate scan merge artifact from source run
        if: ${{ inputs.detail_retry_run_id != '' }}
        run: >-
          GITHUB_RUN_ID="${{ needs.validate-detail-retry-source.outputs.run_id }}"
          GITHUB_SHA="${{ needs.validate-detail-retry-source.outputs.commit_sha }}"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=scan-merge
          --artifact-dir="${RUNNER_TEMP}/brochure-scan-merge"
          --files=all-stores-full.json
          --manifest-sha256="${{ steps.source-manifests.outputs.scan_manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ steps.source-manifests.outputs.scan_predecessor_manifest_sha256 }}"

      - name: Copy scan input
        run: |
          mkdir -p tools/crawler/data/listing-only
          cp "${RUNNER_TEMP}/brochure-scan-merge/all-stores-full.json" tools/crawler/data/listing-only/all-stores-full.json

      - name: Restore detail metadata progress
        id: restore-detail-progress
        uses: actions/cache/restore@v4
        with:
          path: tools/crawler/data/listing-only/.detail-page-metadata-progress.jsonl
          key: ${{ inputs.detail_retry_run_id != '' && format('brochure-detail-progress-{0}-{1}-{2}', inputs.detail_retry_run_id, github.run_id, github.run_attempt) || format('brochure-detail-progress-{0}-{1}', github.run_id, github.run_attempt) }}
          restore-keys: |
            brochure-detail-progress-${{ inputs.detail_retry_run_id || github.run_id }}-

      - name: Initialize detail metadata progress
        run: |
          mkdir -p tools/crawler/data/listing-only
          touch tools/crawler/data/listing-only/.detail-page-metadata-progress.jsonl

      - name: Authenticate with Bring
        env:
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
          BRING_AUTH_TOKEN: ${{ secrets.BRING_AUTH_TOKEN }}
          BRING_API_KEY: ${{ secrets.BRING_API_KEY }}
          BRING_USER_UUID: ${{ secrets.BRING_USER_UUID }}
        run: |
          if [ -n "$BRING_EMAIL" ] && [ -n "$BRING_PASSWORD" ]; then
            bun run scripts/bring-auth.ts
          else
            {
              echo "BRING_AUTH_TOKEN=$BRING_AUTH_TOKEN"
              echo "BRING_API_KEY=$BRING_API_KEY"
              echo "BRING_USER_UUID=$BRING_USER_UUID"
            } >> "$GITHUB_ENV"
          fi

      - name: Fetch or reuse detail metadata by BRN
        id: fetch-details
        env:
          BROCHURE_LOCATIONS_FILE: ${{ runner.temp }}/brochure-prepare-inputs/geonames-DE.txt
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run tools/crawler/brochures/listing-only/fetch-detail-pages.ts

      - name: Save detail metadata progress for a retry
        if: ${{ always() && steps.fetch-details.outcome != 'success' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: tools/crawler/data/listing-only/.detail-page-metadata-progress.jsonl
          key: ${{ inputs.detail_retry_run_id != '' && format('brochure-detail-progress-{0}-{1}-{2}', inputs.detail_retry_run_id, github.run_id, github.run_attempt) || format('brochure-detail-progress-{0}-{1}', github.run_id, github.run_attempt) }}

      - name: Create detail phase artifact
        id: create-manifest
        run: |
          artifact_dir="${RUNNER_TEMP}/brochure-detail-pages"
          mkdir -p "$artifact_dir"
          cp tools/crawler/data/listing-only/detail-pages.json "$artifact_dir/detail-pages.json"
          cp tools/crawler/data/listing-only/detail-page-metadata.json "$artifact_dir/detail-page-metadata.json"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts create \
            --phase=detail-pages \
            --artifact-dir="$artifact_dir" \
            --files=detail-pages.json,detail-page-metadata.json \
            --predecessor-manifest-sha256="${{ inputs.detail_retry_run_id != '' && steps.source-manifests.outputs.scan_manifest_sha256 || needs.scan-merge.outputs.manifest_sha256 }}"

      - name: Upload detail phase artifact
        uses: actions/upload-artifact@v4
        with:
          name: brochure-detail-pages-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-detail-pages/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  persistence:
    name: BRN-Metadaten und PLZ-Verfügbarkeit persistieren
    needs: [validate-secrets, scan-merge, detail-pages]
    if: >-
      ${{ always() && inputs.resume_run_id == '' &&
          github.ref == 'refs/heads/main' &&
          needs.validate-secrets.result == 'success' &&
          needs.scan-merge.result == 'success' &&
          needs.detail-pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      manifest_sha256: ${{ steps.create-manifest.outputs.manifest_sha256 }}
      predecessor_manifest_sha256: ${{ steps.create-manifest.outputs.predecessor_manifest_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Download scan merge artifact
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-scan-merge

      - name: Validate scan merge artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=scan-merge
          --artifact-dir="${RUNNER_TEMP}/brochure-scan-merge"
          --files=all-stores-full.json
          --manifest-sha256="${{ needs.scan-merge.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.scan-merge.outputs.predecessor_manifest_sha256 }}"

      - name: Download detail phase artifact
        uses: actions/download-artifact@v5
        with:
          name: brochure-detail-pages-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-detail-pages

      - name: Validate detail phase artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=detail-pages
          --artifact-dir="${RUNNER_TEMP}/brochure-detail-pages"
          --files=detail-pages.json,detail-page-metadata.json
          --manifest-sha256="${{ needs.detail-pages.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.detail-pages.outputs.predecessor_manifest_sha256 }}"

      - name: Copy persistence inputs
        run: |
          mkdir -p tools/crawler/data/listing-only
          cp "${RUNNER_TEMP}/brochure-scan-merge/all-stores-full.json" tools/crawler/data/listing-only/all-stores-full.json
          cp "${RUNNER_TEMP}/brochure-detail-pages/detail-page-metadata.json" tools/crawler/data/listing-only/detail-page-metadata.json

      - name: Persist BRN metadata and listing availability
        run: bun run tools/crawler/brochures/listing-only/persist-canonical.ts

      - name: Create persistence phase artifact
        id: create-manifest
        run: |
          artifact_dir="${RUNNER_TEMP}/brochure-persistence"
          mkdir -p "$artifact_dir"
          cp tools/crawler/data/listing-only/canonical-brochures.json "$artifact_dir/canonical-brochures.json"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts create \
            --phase=persistence \
            --artifact-dir="$artifact_dir" \
            --files=canonical-brochures.json \
            --predecessor-manifest-sha256="${{ needs.scan-merge.outputs.manifest_sha256 }},${{ needs.detail-pages.outputs.manifest_sha256 }}"

      - name: Upload persistence phase artifact
        uses: actions/upload-artifact@v4
        with:
          name: brochure-persistence-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-persistence/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  report:
    name: Konsistenzbericht erstellen
    needs: [validate-secrets, scan-merge, persistence]
    if: >-
      ${{ always() && inputs.resume_run_id == '' &&
          github.ref == 'refs/heads/main' &&
          needs.validate-secrets.result == 'success' &&
          needs.scan-merge.result == 'success' &&
          needs.persistence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      manifest_sha256: ${{ steps.create-manifest.outputs.manifest_sha256 }}
      predecessor_manifest_sha256: ${{ steps.create-manifest.outputs.predecessor_manifest_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Download scan merge artifact
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-scan-merge

      - name: Validate scan merge artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=scan-merge
          --artifact-dir="${RUNNER_TEMP}/brochure-scan-merge"
          --files=all-stores-full.json
          --manifest-sha256="${{ needs.scan-merge.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.scan-merge.outputs.predecessor_manifest_sha256 }}"

      - name: Download persistence phase artifact
        uses: actions/download-artifact@v5
        with:
          name: brochure-persistence-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-persistence

      - name: Validate persistence phase artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=persistence
          --artifact-dir="${RUNNER_TEMP}/brochure-persistence"
          --files=canonical-brochures.json
          --manifest-sha256="${{ needs.persistence.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.persistence.outputs.predecessor_manifest_sha256 }}"

      - name: Copy report inputs
        run: |
          mkdir -p tools/crawler/data/listing-only
          cp "${RUNNER_TEMP}/brochure-scan-merge/all-stores-full.json" tools/crawler/data/listing-only/all-stores-full.json
          cp "${RUNNER_TEMP}/brochure-persistence/canonical-brochures.json" tools/crawler/data/listing-only/canonical-brochures.json

      - name: Build coverage and consistency report
        run: bun run tools/crawler/brochures/listing-only/canonical-report.ts

      - name: Create report phase artifact
        id: create-manifest
        run: |
          artifact_dir="${RUNNER_TEMP}/brochure-report"
          mkdir -p "$artifact_dir"
          cp tools/crawler/data/listing-only/canonical-report.json "$artifact_dir/canonical-report.json"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts create \
            --phase=report \
            --artifact-dir="$artifact_dir" \
            --files=canonical-report.json \
            --predecessor-manifest-sha256="${{ needs.scan-merge.outputs.manifest_sha256 }},${{ needs.persistence.outputs.manifest_sha256 }}"

      - name: Upload report phase artifact
        uses: actions/upload-artifact@v4
        with:
          name: brochure-report-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-report/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  publication-handoff:
    name: Veröffentlichungs-Handoff erstellen
    needs: [validate-secrets, scan-merge, detail-pages, persistence, report]
    if: >-
      ${{ always() && inputs.resume_run_id == '' &&
          github.ref == 'refs/heads/main' &&
          needs.validate-secrets.result == 'success' &&
          needs.scan-merge.result == 'success' &&
          needs.detail-pages.result == 'success' &&
          needs.persistence.result == 'success' &&
          needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      manifest_sha256: ${{ steps.create-publication-handoff.outputs.manifest_sha256 }}
      phase_manifest_sha256: ${{ steps.create-phase-manifest.outputs.manifest_sha256 }}
      phase_predecessor_manifest_sha256: ${{ steps.create-phase-manifest.outputs.predecessor_manifest_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Download scan merge artifact
        uses: actions/download-artifact@v5
        with:
          name: brochure-scan-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-scan-merge

      - name: Validate scan merge artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=scan-merge
          --artifact-dir="${RUNNER_TEMP}/brochure-scan-merge"
          --files=all-stores-full.json
          --manifest-sha256="${{ needs.scan-merge.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.scan-merge.outputs.predecessor_manifest_sha256 }}"

      - name: Download detail phase artifact
        uses: actions/download-artifact@v5
        with:
          name: brochure-detail-pages-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-detail-pages

      - name: Validate detail phase artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=detail-pages
          --artifact-dir="${RUNNER_TEMP}/brochure-detail-pages"
          --files=detail-pages.json,detail-page-metadata.json
          --manifest-sha256="${{ needs.detail-pages.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.detail-pages.outputs.predecessor_manifest_sha256 }}"

      - name: Download persistence phase artifact
        uses: actions/download-artifact@v5
        with:
          name: brochure-persistence-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-persistence

      - name: Validate persistence phase artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=persistence
          --artifact-dir="${RUNNER_TEMP}/brochure-persistence"
          --files=canonical-brochures.json
          --manifest-sha256="${{ needs.persistence.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.persistence.outputs.predecessor_manifest_sha256 }}"

      - name: Download report phase artifact
        uses: actions/download-artifact@v5
        with:
          name: brochure-report-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-report

      - name: Validate report phase artifact
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=report
          --artifact-dir="${RUNNER_TEMP}/brochure-report"
          --files=canonical-report.json
          --manifest-sha256="${{ needs.report.outputs.manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.report.outputs.predecessor_manifest_sha256 }}"

      - name: Copy handoff inputs
        run: |
          mkdir -p tools/crawler/data/listing-only
          cp "${RUNNER_TEMP}/brochure-scan-merge/all-stores-full.json" tools/crawler/data/listing-only/all-stores-full.json
          cp "${RUNNER_TEMP}/brochure-persistence/canonical-brochures.json" tools/crawler/data/listing-only/canonical-brochures.json

      - name: Create integrity-bound metadata handoff
        id: create-publication-handoff
        run: >-
          bun run tools/crawler/brochures/listing-only/publication-handoff.ts create
          --source-dir=tools/crawler/data/listing-only
          --bundle-dir="${RUNNER_TEMP}/brochure-publication/handoff"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Create publication phase artifact
        id: create-phase-manifest
        run: |
          artifact_dir="${RUNNER_TEMP}/brochure-publication/phase"
          mkdir -p "$artifact_dir"
          cp "${RUNNER_TEMP}/brochure-publication/handoff/publication-handoff.json" "$artifact_dir/publication-handoff.json"
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts create \
            --phase=publication-handoff \
            --artifact-dir="$artifact_dir" \
            --files=publication-handoff.json \
            --predecessor-manifest-sha256="${{ needs.scan-merge.outputs.manifest_sha256 }},${{ needs.detail-pages.outputs.manifest_sha256 }},${{ needs.persistence.outputs.manifest_sha256 }},${{ needs.report.outputs.manifest_sha256 }}"

      - name: Upload metadata handoff and phase manifest
        uses: actions/upload-artifact@v4
        with:
          name: brochure-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-publication/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  publish-canonical:
    name: Supabase-Metadatenkatalog aktualisieren
    needs: publication-handoff
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (inputs.resume_run_id != '' ||
           (needs.publication-handoff.result == 'success' &&
            needs.publication-handoff.outputs.manifest_sha256 != '' &&
            needs.publication-handoff.outputs.phase_manifest_sha256 != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate resume source run
        if: ${{ inputs.resume_run_id != '' }}
        id: resume-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="$RESUME_RUN_ID"
          if [[ ! "$run_id" =~ ^[1-9][0-9]{0,19}$ ]]; then
            printf '::error::resume_run_id must be a positive numeric run ID.\n'
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          read -r status conclusion branch commit_sha workflow_path < <(
            jq -r '[.status, .conclusion, .head_branch, .head_sha, .path] | @tsv' <<<"$run_json"
          )
          if [[ "$status" != "completed" || "$branch" != "main" ||
                "$workflow_path" != ".github/workflows/update-brochures.yml" ||
                ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Resume source is not a completed main run of this repository workflow.\n'
            exit 1
          fi

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          required_jobs=(
            "Crawler-Zugangsdaten prüfen"
            "Eingaben vorbereiten"
            "PLZ-Scan Shard 0"
            "PLZ-Scan Shard 1"
            "PLZ-Scan Shard 2"
            "PLZ-Scan Shard 3"
            "PLZ-Scan zusammenführen"
            "Detail-Metadaten laden"
            "Regionale Metadaten persistieren"
            "Konsistenzbericht erstellen"
            "Veröffentlichungs-Handoff erstellen"
          )
          for job_name in "${required_jobs[@]}"; do
            job_count="$(jq --arg name "$job_name" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs_json")"
            job_conclusion="$(jq -r --arg name "$job_name" '[.jobs[] | select(.name == $name) | .conclusion][0] // ""' <<<"$jobs_json")"
            if [[ "$job_count" != "1" || "$job_conclusion" != "success" ]]; then
              printf '::error::Resume source job is not exactly one successful %s job.\n' "$job_name"
              exit 1
            fi
          done

          publish_conclusion="$(jq -r '[.jobs[] | select(.name == "Supabase-Metadatenkatalog aktualisieren") | .conclusion][0] // ""' <<<"$jobs_json")"
          if [[ "$publish_conclusion" != "failure" &&
                "$publish_conclusion" != "cancelled" &&
                "$publish_conclusion" != "timed_out" ]]; then
            printf '::error::Resume source must have failed only in the Supabase publisher.\n'
            exit 1
          fi

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_name="brochure-publication-${run_id}"
          artifact_count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)] | length' <<<"$artifacts_json")"
          artifact_valid="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0)] | length' <<<"$artifacts_json")"
          if [[ "$artifact_count" != "1" || "$artifact_valid" != "1" ]]; then
            printf '::error::Resume metadata handoff is missing, expired, duplicated, or empty.\n'
            exit 1
          fi

          printf 'source_run_id=%s\nsource_commit_sha=%s\n' "$run_id" "$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout publisher commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Download same-run metadata handoff
        if: ${{ inputs.resume_run_id == '' }}
        uses: actions/download-artifact@v5
        with:
          name: brochure-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/brochure-publication

      - name: Download metadata handoff from source run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          name: brochure-publication-${{ inputs.resume_run_id }}
          path: ${{ runner.temp }}/brochure-publication
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          digest-mismatch: error

      - name: Bind and validate downloaded resume handoff
        if: ${{ inputs.resume_run_id != '' }}
        id: resume-handoff
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ steps.resume-source.outputs.source_run_id }}
          GITHUB_SHA: ${{ steps.resume-source.outputs.source_commit_sha }}
        run: |
          set -euo pipefail
          phase_manifest="${RUNNER_TEMP}/brochure-publication/phase/phase-artifact.json"
          handoff_manifest="${RUNNER_TEMP}/brochure-publication/handoff/publication-handoff.json"
          test -s "$phase_manifest"
          test -s "$handoff_manifest"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg run_id "$GITHUB_RUN_ID" --arg commit_sha "$GITHUB_SHA" '
            .version == 1 and .phase == "publication-handoff" and
            .repository == $repository and .runId == $run_id and .commitSha == $commit_sha and
            (.predecessorManifestSha256 | type == "array" and length == 4 and all(.[]; test("^[a-f0-9]{64}$"))) and
            (.files | length == 1 and .[0].name == "publication-handoff.json" and
              (.[0].sha256 | test("^[a-f0-9]{64}$")))
          ' "$phase_manifest"
          printf 'phase_manifest_sha256=%s\n' "$(sha256sum "$phase_manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'handoff_manifest_sha256=%s\n' "$(sha256sum "$handoff_manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'predecessor_manifest_sha256=%s\n' "$(jq -er '.predecessorManifestSha256 | join(",")' "$phase_manifest")" >> "$GITHUB_OUTPUT"

      - name: Validate same-run metadata phase artifact
        if: ${{ inputs.resume_run_id == '' }}
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=publication-handoff
          --artifact-dir="${RUNNER_TEMP}/brochure-publication/phase"
          --files=publication-handoff.json
          --manifest-sha256="${{ needs.publication-handoff.outputs.phase_manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ needs.publication-handoff.outputs.phase_predecessor_manifest_sha256 }}"

      - name: Validate cross-run metadata phase artifact
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ steps.resume-source.outputs.source_run_id }}
          GITHUB_SHA: ${{ steps.resume-source.outputs.source_commit_sha }}
        run: >-
          bun run tools/crawler/brochures/listing-only/phase-artifact.ts validate
          --phase=publication-handoff
          --artifact-dir="${RUNNER_TEMP}/brochure-publication/phase"
          --files=publication-handoff.json
          --manifest-sha256="${{ steps.resume-handoff.outputs.phase_manifest_sha256 }}"
          --predecessor-manifest-sha256="${{ steps.resume-handoff.outputs.predecessor_manifest_sha256 }}"

      - name: Publish BRN metadata and ZIP availability to Supabase
        env:
          GITHUB_RUN_ID: ${{ inputs.resume_run_id != '' && steps.resume-source.outputs.source_run_id || github.run_id }}
          GITHUB_SHA: ${{ inputs.resume_run_id != '' && steps.resume-source.outputs.source_commit_sha || github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          bun run tools/crawler/brochures/listing-only/publish-full-canonical.ts
          --bundle-dir="${RUNNER_TEMP}/brochure-publication/handoff"
          --manifest-sha256="${{ inputs.resume_run_id != '' && steps.resume-handoff.outputs.handoff_manifest_sha256 || needs.publication-handoff.outputs.manifest_sha256 }}"

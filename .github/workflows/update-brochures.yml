name: Canonical Brochure Catalog Update

on:
  workflow_dispatch:

  schedule:
    # Montag und Donnerstag: Bring-Wochenangebote vollständig aktualisieren.
    - cron: "17 4 * * 1"
    - cron: "17 4 * * 4"

concurrency:
  # A single writer protects the shared R2 storage budget and app catalog.
  group: brochure-dump-update-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-secrets:
    name: Crawler-Zugangsdaten prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate required secrets
        env:
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
          BRING_AUTH_TOKEN: ${{ secrets.BRING_AUTH_TOKEN }}
          BRING_API_KEY: ${{ secrets.BRING_API_KEY }}
          BRING_USER_UUID: ${{ secrets.BRING_USER_UUID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'r2-broschure' }}
        run: |
          if [ -n "${BRING_EMAIL:-}" ] && [ -n "${BRING_PASSWORD:-}" ]; then
            echo "Bring headless login is configured."
          elif [ -n "${BRING_AUTH_TOKEN:-}" ] && [ -n "${BRING_API_KEY:-}" ] && [ -n "${BRING_USER_UUID:-}" ]; then
            echo "Static Bring credentials are configured."
          else
            printf '::error::Configure Bring email/password or all three static Bring tokens.\n'
            exit 1
          fi

          required=(SUPABASE_URL SUPABASE_SECRET_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing publication secrets: %s\n' "${missing[*]}"
            exit 1
          fi

  full-scan-and-publish:
    name: Vollständige Verifikation und Veröffentlichung
    needs: validate-secrets
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BROCHURE_R2_STORAGE_BUDGET_GB: "7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Cache GeoNames postal codes
        id: cache-geonames
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/geonames-DE.txt
          key: geonames-de-postal-codes-v1

      - name: Download German postal codes
        if: ${{ steps.cache-geonames.outputs.cache-hit != 'true' }}
        run: |
          curl --fail --silent --show-error --location \
            https://download.geonames.org/export/zip/DE.zip \
            --output "${RUNNER_TEMP}/geonames-DE.zip"
          unzip -p "${RUNNER_TEMP}/geonames-DE.zip" DE.txt > "${RUNNER_TEMP}/geonames-DE.txt"
          test -s "${RUNNER_TEMP}/geonames-DE.txt"

      - name: Authenticate with Bring
        env:
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
          BRING_AUTH_TOKEN: ${{ secrets.BRING_AUTH_TOKEN }}
          BRING_API_KEY: ${{ secrets.BRING_API_KEY }}
          BRING_USER_UUID: ${{ secrets.BRING_USER_UUID }}
        run: |
          if [ -n "$BRING_EMAIL" ] && [ -n "$BRING_PASSWORD" ]; then
            bun run scripts/bring-auth.ts
          else
            {
              echo "BRING_AUTH_TOKEN=$BRING_AUTH_TOKEN"
              echo "BRING_API_KEY=$BRING_API_KEY"
              echo "BRING_USER_UUID=$BRING_USER_UUID"
            } >> "$GITHUB_ENV"
          fi

      - name: Scan all German postal codes
        env:
          BROCHURE_LOCATIONS_FILE: ${{ runner.temp }}/geonames-DE.txt
        run: bun run tools/crawler/brochures/listing-only/all-stores-full.ts

      - name: Load exact page counts for every BRN
        env:
          BROCHURE_LOCATIONS_FILE: ${{ runner.temp }}/geonames-DE.txt
        run: bun run tools/crawler/brochures/listing-only/fetch-detail-pages.ts

      - name: Group exact metadata
        run: bun run tools/crawler/brochures/listing-only/group-canonical.ts

      - name: Download and verify every ordered page vector
        env:
          BROCHURE_LOCATIONS_FILE: ${{ runner.temp }}/geonames-DE.txt
        run: >-
          bun run tools/crawler/brochures/listing-only/verify-full-brochures.ts
          --all-brns
          --budget-bytes=7000000000

      - name: Clear Bring credentials after page verification
        run: |
          printf 'BRING_AUTH_TOKEN=\nBRING_API_KEY=\nBRING_USER_UUID=\n' >> "$GITHUB_ENV"

      - name: Persist verified canonical catalog
        run: bun run tools/crawler/brochures/listing-only/persist-canonical.ts

      - name: Build coverage and consistency report
        run: bun run tools/crawler/brochures/listing-only/canonical-report.ts

      - name: Publish verified pages to private R2 and catalog to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'r2-broschure' }}
        run: bun run tools/crawler/brochures/listing-only/publish-full-canonical.ts

      - name: Archive full-scan verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brochure-full-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/crawler/data/listing-only/all-stores-full.json
            tools/crawler/data/listing-only/detail-pages.json
            tools/crawler/data/listing-only/canonical-groups.json
            tools/crawler/data/listing-only/canonical-page-verification.json
            tools/crawler/data/listing-only/canonical-brochures.json
            tools/crawler/data/listing-only/canonical-report.json
          if-no-files-found: ignore
          retention-days: 30

name: autofix.ci

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Deterministic fixes and typecheck
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Apply deterministic Biome fixes
        run: bun run check:fix

      - name: Typecheck
        run: bun run typecheck

      - name: Submit autofix
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a

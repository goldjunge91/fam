name: Run iOS Offline Runtime
description: Install the prepared iOS app, cut external network access, and launch it with localhost Metro

inputs:
  app-path:
    description: Path to the downloaded simulator app archive
    required: true

runs:
  using: composite
  steps:
    - name: Extract simulator app artifact
      id: app
      shell: bash
      env:
        APP_ARCHIVE: ${{ inputs.app-path }}
      run: |
        set -Eeuo pipefail
        : "${APP_ARCHIVE:?APP_ARCHIVE is required}"

        app_dir="$GITHUB_WORKSPACE/build/cache/ios/offline-runtime/app"
        mkdir -p "$app_dir"
        tar -xzf "$APP_ARCHIVE" -C "$app_dir"

        app_path="$(find "$app_dir" -type d -name '*.app' -print -quit)"
        if [[ -z "$app_path" ]]; then
          echo "No simulator .app was found in $APP_ARCHIVE." >&2
          exit 1
        fi

        echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

    - name: Boot an iOS Simulator
      id: simulator
      shell: bash
      run: |
        set -Eeuo pipefail

        simulator_udid="$(
          xcrun simctl list devices available |
            sed -nE 's/.*iPhone[^()]* \(([0-9A-F-]{36})\) \((Booted|Shutdown)\).*/\1/p' |
            head -n 1
        )"

        if [[ -z "$simulator_udid" ]]; then
          echo "No available iPhone Simulator found." >&2
          xcrun simctl list devices available >&2
          exit 1
        fi

        xcrun simctl boot "$simulator_udid" 2>/dev/null || true
        xcrun simctl bootstatus "$simulator_udid" -b
        echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"

    - name: Start Metro on localhost
      id: metro
      shell: bash
      env:
        REACT_NATIVE_PACKAGER_HOSTNAME: localhost
      run: |
        set -Eeuo pipefail

        runtime_dir="$GITHUB_WORKSPACE/build/cache/ios/offline-runtime"
        mkdir -p "$runtime_dir"
        metro_log="$runtime_dir/fam-ios-metro.log"
        nohup bun run start -- --dev-client --localhost >"$metro_log" 2>&1 &
        metro_pid=$!
        echo "METRO_PID=$metro_pid" >> "$GITHUB_ENV"

        metro_ready=false
        for _ in {1..60}; do
          if curl --fail --silent --show-error --noproxy '*' \
            http://localhost:8081/status >/dev/null; then
            metro_ready=true
            break
          fi

          if ! kill -0 "$metro_pid" 2>/dev/null; then
            cat "$metro_log" >&2
            echo "Metro exited before becoming ready." >&2
            exit 1
          fi

          sleep 2
        done

        if [[ "$metro_ready" != true ]]; then
          cat "$metro_log" >&2
          echo "Metro did not become ready within 120 seconds." >&2
          exit 1
        fi

        echo "Metro is ready on localhost before app installation."

    - name: Install app in Simulator
      id: install
      shell: bash
      env:
        APP_PATH: ${{ steps.app.outputs.app_path }}
        SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
      run: |
        set -Eeuo pipefail
        : "${APP_PATH:?APP_PATH is required}"
        : "${SIMULATOR_UDID:?SIMULATOR_UDID is required}"

        bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Info.plist")"
        xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
        xcrun simctl get_app_container "$SIMULATOR_UDID" "$bundle_id" app >/dev/null

        echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
        echo "The app is installed; network isolation is the next checkpoint."

    - name: Capture network service state
      id: network
      shell: bash
      run: |
        set -Eeuo pipefail

        state_file="$GITHUB_WORKSPACE/build/cache/ios/offline-runtime/network-services.tsv"
        mkdir -p "$(dirname "$state_file")"
        : > "$state_file"
        echo "state_file=$state_file" >> "$GITHUB_OUTPUT"

        curl --fail --silent --show-error \
          --noproxy '*' \
          --connect-timeout 5 --max-time 10 \
          https://example.com/ >/dev/null

        while IFS= read -r raw_service; do
          service="${raw_service#\*}"
          service="${service#"${service%%[![:space:]]*}"}"
          [[ -z "$service" ]] && continue

          status="$(networksetup -getnetworkserviceenabled "$service" 2>/dev/null || true)"
          if [[ "$status" != "Enabled" && "$status" != "Disabled" ]]; then
            echo "Could not determine the state of network service: $service" >&2
            exit 1
          fi

          printf '%s\t%s\n' "$status" "$service" >> "$state_file"
        done < <(networksetup -listallnetworkservices | tail -n +2)

        if [[ ! -s "$state_file" ]]; then
          echo "No macOS network services were found." >&2
          exit 1
        fi

        echo "Captured network services:"
        sed 's/^/  /' "$state_file"

    - name: Disable external network and launch app offline
      shell: bash
      env:
        BUNDLE_ID: ${{ steps.install.outputs.bundle_id }}
        STATE_FILE: ${{ steps.network.outputs.state_file }}
        SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
      run: |
        set -Eeuo pipefail
        : "${BUNDLE_ID:?BUNDLE_ID is required}"
        : "${STATE_FILE:?STATE_FILE is required}"
        : "${SIMULATOR_UDID:?SIMULATOR_UDID is required}"

        if ! sudo -n true 2>/dev/null; then
          echo "The macOS runner does not allow passwordless sudo for networksetup." >&2
          exit 1
        fi

        while IFS=$'\t' read -r expected_status service; do
          [[ -z "$service" ]] && continue
          [[ "$expected_status" == "Enabled" ]] || continue
          sudo -n networksetup -setnetworkserviceenabled "$service" off
        done < "$STATE_FILE"

        if curl --fail --silent --show-error \
          --noproxy '*' \
          --connect-timeout 5 --max-time 10 \
          https://example.com/ >/dev/null; then
          echo "The runner still has external network access after cutover." >&2
          exit 1
        fi

        xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID"
        sleep 10
        curl --fail --silent --show-error --noproxy '*' \
          http://localhost:8081/status >/dev/null
        xcrun simctl spawn "$SIMULATOR_UDID" launchctl print system >/dev/null
        echo "The installed app launched while external network access was disabled; local Metro remains available."

    - name: Restore network service state
      if: ${{ always() }}
      shell: bash
      env:
        STATE_FILE: ${{ steps.network.outputs.state_file }}
      run: |
        set -Eeuo pipefail

        if [[ -z "${STATE_FILE:-}" || ! -f "$STATE_FILE" ]]; then
          echo "No network state was captured; skipping network restoration."
          exit 0
        fi

        restore_failed=0
        while IFS=$'\t' read -r expected_status service; do
          [[ -z "$service" ]] && continue

          if [[ "$expected_status" == "Enabled" ]]; then
            if ! sudo -n networksetup -setnetworkserviceenabled "$service" on; then
              echo "Failed to restore enabled network service: $service" >&2
              restore_failed=1
            fi
          else
            if ! sudo -n networksetup -setnetworkserviceenabled "$service" off; then
              echo "Failed to restore disabled network service: $service" >&2
              restore_failed=1
            fi
          fi
        done < "$STATE_FILE"

        if (( restore_failed != 0 )); then
          exit 1
        fi

        curl --fail --silent --show-error \
          --noproxy '*' \
          --connect-timeout 5 --max-time 10 \
          https://example.com/ >/dev/null
        echo "Network service state was restored and external access is available again."

    - name: Stop Metro
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail

        if [[ -n "${METRO_PID:-}" ]] && kill -0 "$METRO_PID" 2>/dev/null; then
          kill "$METRO_PID" || true
          wait "$METRO_PID" 2>/dev/null || true
        fi

    - name: Shut down iOS Simulator
      if: ${{ always() }}
      shell: bash
      env:
        SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
      run: |
        set -Eeuo pipefail
        if [[ -n "${SIMULATOR_UDID:-}" ]]; then
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
        fi

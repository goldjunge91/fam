name: "Setup Bun Environment"
description: "Sets up Bun, caches install cache, and installs dependencies"

inputs:
  bun-version:
    description: "Bun version to install"
    required: false
    default: "1.4.2"
  skip-executorch-download:
    description: "Skip ExecuTorch native artifact downloads for jobs that do not build native code"
    required: false
    default: "false"
  cache-executorch-libs:
    description: "Cache ExecuTorch native artifacts for native builds"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Configure workspace-local caches
      shell: bash
      run: |
        set -Eeuo pipefail
        source scripts/local-build-env.sh
        {
          printf 'TMPDIR=%s\n' "$TMPDIR"
          printf 'BUN_INSTALL_CACHE_DIR=%s\n' "$BUN_INSTALL_CACHE_DIR"
          printf 'BUN_RUNTIME_TRANSPILER_CACHE_PATH=%s\n' "$BUN_RUNTIME_TRANSPILER_CACHE_PATH"
          printf 'CP_HOME_DIR=%s\n' "$CP_HOME_DIR"
          printf 'NPM_CONFIG_CACHE=%s\n' "$NPM_CONFIG_CACHE"
          printf 'npm_config_cache=%s\n' "$npm_config_cache"
          printf 'NODE_COMPILE_CACHE=%s\n' "$NODE_COMPILE_CACHE"
          printf 'XDG_CACHE_HOME=%s\n' "$XDG_CACHE_HOME"
          printf '__UNSAFE_EXPO_HOME_DIRECTORY=%s\n' "$__UNSAFE_EXPO_HOME_DIRECTORY"
          printf 'RNET_LIBS_CACHE_DIR=%s\n' "$GITHUB_WORKSPACE/build/cache/react-native-executorch"
          if [[ "${{ inputs.skip-executorch-download }}" == "true" ]]; then
            printf 'RNET_SKIP_DOWNLOAD=1\n'
          fi
          if [[ -n "${CCACHE_BINARY:-}" ]]; then
            printf 'CCACHE_BINARY=%s\n' "$CCACHE_BINARY"
            printf 'CCACHE_DIR=%s\n' "$CCACHE_DIR"
          fi
        } >> "$GITHUB_ENV"

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun Dependencies
      uses: actions/cache@v6
      with:
        path: build/cache/bun/install
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bunfig.toml') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Cache CocoaPods
      uses: actions/cache@v6
      with:
        # CP_HOME_DIR is set above; cache both the pod sources/specs and the
        # downloaded pre-built React Native artifacts so that pod install never
        # needs to re-download them on a cache hit.
        path: build/cache/ios/cocoapods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Cache ExecuTorch native libraries
      if: inputs.cache-executorch-libs == 'true'
      uses: actions/cache@v6
      with:
        path: build/cache/react-native-executorch
        save-always: true
        # bun.lock pins the exact package tarball, which carries nativeLibsVersion;
        # package.json also contains the enabled backend/library configuration.
        key: ${{ runner.os }}-executorch-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json') }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

name: Build iOS Simulator App
description: Build and publish the Debug iOS Simulator app used by the offline workflow

inputs:
  xcode-version:
    description: Xcode version used for the native build
    required: false
    default: "26.4.1"
  artifact-name:
    description: GitHub Actions artifact name
    required: true
  artifact-retention-days:
    description: Number of days to retain the simulator artifact
    required: false
    default: "7"

outputs:
  artifact_name:
    description: Uploaded artifact name
    value: ${{ inputs.artifact-name }}
  artifact_id:
    description: Uploaded artifact id
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact_url:
    description: Uploaded artifact URL
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Select Xcode ${{ inputs.xcode-version }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Setup Bun environment
      uses: ./.github/actions/setup-bun-env

    - name: Build iOS app and Watch target
      shell: bash
      run: bun run ios:watch

    - name: Package simulator app
      id: package
      shell: bash
      run: |
        set -Eeuo pipefail

        app_path="build/cache/ios/watch-build/Products/Debug-iphonesimulator/fam.app"
        if [[ ! -d "$app_path" ]]; then
          echo "The Watch build did not produce $app_path." >&2
          exit 1
        fi
        if [[ ! -d "$app_path/Watch/watch.app" ]]; then
          echo "The simulator app does not contain the Watch app." >&2
          exit 1
        fi

        mkdir -p build/local/ci-artifacts
        artifact_path="build/local/ci-artifacts/fam-watch-simulator.app.tar.gz"
        tar -C "$(dirname "$app_path")" -czf "$artifact_path" "$(basename "$app_path")"
        echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"

    - name: Upload simulator app artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.package.outputs.artifact_path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error

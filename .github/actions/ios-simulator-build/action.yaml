name: Build iOS Simulator App
description: Build and publish the Debug iOS Simulator app used by the offline workflow

inputs:
  xcode-version:
    description: Xcode version used for the native build
    required: false
    default: "26.4.1"
  artifact-name:
    description: GitHub Actions artifact name
    required: true
  artifact-retention-days:
    description: Number of days to retain the simulator artifact
    required: false
    default: "7"

outputs:
  artifact_name:
    description: Uploaded artifact name
    value: ${{ inputs.artifact-name }}
  artifact_id:
    description: Uploaded artifact id
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact_url:
    description: Uploaded artifact URL
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Select Xcode ${{ inputs.xcode-version }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Setup Bun environment
      uses: ./.github/actions/setup-bun-env

    - name: Build iOS simulator app
      id: build
      shell: bash
      run: |
        set -Eeuo pipefail

        build_log="build/local/ci-artifacts/build-simulator.log"
        mkdir -p "$(dirname "$build_log")"
        bun run build:simulator 2>&1 | tee "$build_log"

        artifact_count="$(grep -c '^Artefakt: ' "$build_log" || true)"
        if [[ "$artifact_count" != "1" ]]; then
          echo "Expected exactly one artifact path from build:simulator, found $artifact_count." >&2
          exit 1
        fi

        app_path="$(sed -n 's/^Artefakt: //p' "$build_log")"
        if [[ "$app_path" != build/local/eas/development-local/*/fam.app ]]; then
          echo "Unexpected simulator app path from build:simulator: $app_path" >&2
          exit 1
        fi
        if [[ ! -f "$app_path" || -L "$app_path" ]]; then
          echo "The simulator build did not produce the expected app archive at $app_path." >&2
          exit 1
        fi

        expected_root="$(cd build/local/eas/development-local && pwd -P)"
        resolved_app_parent="$(cd "$(dirname "$app_path")" && pwd -P)"
        resolved_app_path="$resolved_app_parent/$(basename "$app_path")"
        run_id="${resolved_app_parent#"$expected_root"/}"
        if [[ "$(basename "$resolved_app_path")" != fam.app || -z "$run_id" || "$run_id" == */* ]]; then
          echo "Simulator app archive is outside build/local/eas/development-local/<run-id>/fam.app: $app_path" >&2
          exit 1
        fi

        required_members=(
          "Debug-iphonesimulator/fam.app/Info.plist"
          "Debug-watchsimulator/watch.app/Info.plist"
          "Debug-iphonesimulator/fam.app/Watch/watch.app/Info.plist"
        )
        if ! archive_members="$(tar -tzf "$app_path")"; then
          echo "The simulator app artifact is not a valid gzip tarball: $app_path" >&2
          exit 1
        fi
        for required_member in "${required_members[@]}"; do
          if ! grep -Fqx "$required_member" <<<"$archive_members"; then
            echo "Missing required simulator archive member $required_member in $app_path." >&2
            exit 1
          fi
        done

        printf 'app_path=%s\n' "$app_path" >> "$GITHUB_OUTPUT"

    - name: Upload simulator build diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-diagnostics
        path: build/local/ci-artifacts/build-simulator.log
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: ignore

    - name: Package simulator app
      id: package
      shell: bash
      env:
        APP_PATH: ${{ steps.build.outputs.app_path }}
      run: |
        set -Eeuo pipefail
        : "${APP_PATH:?APP_PATH is required}"

        mkdir -p build/local/ci-artifacts
        artifact_path="build/local/ci-artifacts/fam-watch-simulator.app.tar.gz"
        cp "$APP_PATH" "$artifact_path"
        printf 'artifact_path=%s\n' "$artifact_path" >> "$GITHUB_OUTPUT"

    - name: Upload simulator app artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.package.outputs.artifact_path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error
